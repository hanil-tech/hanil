<!doctype html>
<html lang="ko" data-notheme="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대용량 파일 — 한일</title>
<style>
/* 포털에 붙이는 단순한 모양 — 색은 여기 몇 줄만 바꾸면 포털에 맞춰진다 */
:root{--bg:#fff;--fg:#222;--sub:#777;--line:#ddd;--head:#f5f5f5;--acc:#2f5bd3;--ok:#1e7e34;--bad:#c62828;
  --c-wait:#e6e6e6;--c-run:#2f5bd3;--c-done:#9db4ea;--c-retry:#ef8f00;--c-ok:#43a047;--c-bad:#e53935}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--fg);padding-bottom:6px;margin-bottom:12px}
header h1{font-size:16px;margin:0;flex:1}
header .who{color:var(--sub)}
.home{font-size:12px;color:var(--sub);text-decoration:none}
.box{border:1px solid var(--line);margin-bottom:14px}
.box > h2{margin:0;padding:6px 10px;font-size:13px;background:var(--head);border-bottom:1px solid var(--line)}
.inner{padding:10px}
#drop{border:1px dashed #bbb;padding:16px 10px;text-align:center;color:var(--sub)}
#drop b{color:var(--fg);font-size:13px}
#drop.on{border-color:var(--acc);background:#f3f6fd}
#drop .sub{font-size:12px;margin-top:2px}
#drop .btns{margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button,.btn{font:inherit;font-size:12px;border:1px solid #bbb;background:#fff;color:var(--fg);border-radius:2px;padding:3px 8px;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}

/* 주고받는 줄 */
.up{border-top:1px solid var(--line);padding:10px 0}
#ups .up:first-child{border-top:0}
#ups:not(:empty){margin-top:10px}
.up .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.up .nm{flex:1;min-width:140px;font-weight:bold;word-break:break-all}
.up .dir{font-size:11px;border:1px solid var(--line);padding:0 5px;color:var(--sub)}
.up .ctl{display:flex;gap:4px;flex-wrap:wrap}
.up .st{color:var(--sub);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-all}
.st.bad{color:var(--bad)}.st.ok{color:var(--ok)}

/* 그림 — 내 PC → 포털 서버 막대 + 조각(파일) 지도 */
.flow{display:flex;align-items:center;gap:6px;margin:6px 0 4px;font-size:11px;color:var(--sub);white-space:nowrap}
.pipe{flex:1;height:8px;background:var(--c-wait);position:relative;overflow:hidden}
.pipe .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--c-run);transition:width .3s}
.flow.down .pipe .fill{left:auto;right:0}
.flow.check .pipe .fill,.flow.good .pipe .fill{background:var(--c-ok)}
.flow.fail .pipe .fill{background:var(--c-bad)}
canvas.map{display:block;width:100%;height:auto}
.legend{font-size:11px;color:var(--sub);margin-top:3px}
.legend span{margin-right:10px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:3px;vertical-align:0}

/* 검사 결과 — 합격이면 접어 둠 */
.rep{margin-top:6px;border:1px solid var(--line)}
.rep summary{padding:5px 8px;cursor:pointer;font-weight:bold}
.rep.ok summary{color:var(--ok)}.rep.bad summary{color:var(--bad)}
.rep table{width:100%;border-collapse:collapse;font-size:12px}
.rep td,.rep th{padding:4px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.rep th{background:var(--head);font-weight:normal;color:var(--sub)}
.rep td.v{font-family:Consolas,monospace;word-break:break-all;white-space:pre-line}
.rep td.k{white-space:nowrap}
.rep td.j{white-space:nowrap;text-align:center;width:40px}
.j.o{color:var(--ok)}.j.x{color:var(--bad);font-weight:bold}.j.n{color:#aaa}

/* 목록 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tabs button.on{background:var(--fg);border-color:var(--fg);color:#fff}
.tabs input{flex:1;min-width:140px;font:inherit;padding:3px 8px;border:1px solid #bbb}
#ftab{width:100%;border-collapse:collapse;border-top:1px solid var(--fg)}
#ftab th,#ftab td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
#ftab th{background:var(--head);font-weight:normal;color:var(--sub);font-size:12px}
#ftab td.n{word-break:break-all}
#ftab td.r,#ftab th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#ftab td.a{white-space:nowrap;text-align:right}
#ftab td.a button{margin-left:2px}
#ftab tr.sub td{background:#fafafa;padding:0 6px 8px 18px}
.inside{width:100%;border-collapse:collapse;font-size:12px}
.inside td{border-top:1px solid var(--line);padding:2px 4px;word-break:break-all}
.inside td.r{text-align:right;white-space:nowrap;color:var(--sub)}
.tag{font-size:11px;margin-left:4px;color:var(--sub)}
.tag.vbad{color:var(--bad)}.tag.vok{color:var(--ok)}.tag.part{color:var(--c-retry)}
.muted{color:var(--sub);font-size:12px}
.empty{text-align:center;color:var(--sub);padding:20px 0}
footer{color:var(--sub);font-size:11px;margin:4px 0 20px}
dialog{border:1px solid #999;background:#fff;color:var(--fg);padding:14px;max-width:500px;width:calc(100% - 32px)}
dialog::backdrop{background:#0004}
dialog h3{margin:0 0 4px;font-size:14px;word-break:break-all}
dialog label{display:inline-flex;gap:4px;align-items:center;margin:4px 10px 4px 0}
dialog select{font:inherit}
.lk{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
.lk input{flex:1;min-width:180px;font:12px Consolas,monospace;padding:3px 6px;border:1px solid #bbb}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;padding:7px 14px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:10}
#toast.on{opacity:1}
/* 폰 */
@media (max-width:700px){
  .wrap{padding:10px}
  #ftab thead{display:none}
  #ftab,#ftab tbody,#ftab tr,#ftab td{display:block;width:100%}
  #ftab tr{border-bottom:1px solid var(--line);padding:6px 0}
  #ftab td{border:0;padding:1px 0;text-align:left!important}
  #ftab td.r{display:inline-block;width:auto;margin-right:10px;color:var(--sub);font-size:12px}
  #ftab td.a{white-space:normal;margin-top:3px}
  .rep tr.h{display:none}
  .rep table,.rep tbody,.rep tr,.rep td{display:block;width:100%}
  .rep tr{position:relative;border-top:1px solid var(--line);padding:4px 8px}
  .rep td{border:0;padding:1px 0}
  .rep td.k{padding-right:40px;font-weight:bold}
  .rep td.j{position:absolute;top:4px;right:6px;width:auto}
  .rep td.v[data-l]::before{content:attr(data-l) " ";color:var(--sub);font-family:inherit;font-size:11px}
  .rep td.v.e{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>대용량 파일</h1>
    <span class="who" id="who"></span>
    <a class="home" href="/">포털로</a>
  </header>

  <div class="box"><h2>올리기</h2><div class="inner">
    <div id="drop">
      <b>파일이나 폴더를 여기에 끌어다 놓으세요</b>
      <div class="sub" id="limits">폴더는 하위 폴더·빈 폴더까지 그대로 올라갑니다</div>
      <div class="btns"><button id="bFile">파일 고르기</button><button id="bDir">폴더 고르기</button></div>
    </div>
    <input type="file" id="pickF" multiple hidden>
    <input type="file" id="pickD" webkitdirectory multiple hidden>
    <div id="ups"></div>
  </div></div>

  <div class="box"><h2>목록</h2><div class="inner">
    <div class="tabs" id="tabs">
      <button data-t="mine" class="on">내 것</button>
      <button data-t="pub">사내 공개</button>
      <button data-t="all" id="tabAll" hidden>전체(관리자)</button>
      <input id="q" type="search" placeholder="이름·올린 사람 찾기">
      <button id="reload">새로 고침</button>
    </div>
    <table id="ftab">
      <thead><tr><th>이름</th><th class="r">크기</th><th class="r">올린 날</th><th>올린 사람</th><th class="r">받음</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div class="empty" id="empty" hidden>올린 것이 없습니다</div>
  </div></div>
  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <h3 id="dName"></h3>
  <div class="muted">로그인 없이 받을 수 있는 링크입니다. 거래처 등 바깥 사람에게 보낼 때 쓰세요. 폴더는 ZIP 으로 받습니다.</div>
  <div style="margin:10px 0">
    <label>기한 <select id="dDays"></select></label>
    <label>받는 횟수 <select id="dMax"><option value="0">제한 없음</option><option value="1">1번</option><option value="3">3번</option><option value="5">5번</option><option value="10">10번</option></select></label>
    <button class="pri" id="dMake">링크 만들기</button>
  </div>
  <div id="dLinks"></div>
  <div style="text-align:right;margin-top:10px"><button id="dClose">닫기</button></div>
</dialog>
<div id="toast"></div>

<script>
'use strict';
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var INFO = null, FILES = [], TAB = 'mine', JOBS = [], RUNNING = false, SLOTS = null;
  var IN_APP = /HanilPortalApp\//.test(navigator.userAgent);
  //  고른 자리에 바로 쓰기(크롬·엣지, https 또는 localhost) — 되면 받으면서 조각마다 검사, 크기 제한 없음.
  //  안 되는 곳(http·다른 브라우저·폰 앱)은 보통 내려받기(파일) / ZIP(폴더) — 역시 크기 제한 없음, 받은 뒤 [맞춰 보기]로 검사.
  var CAN_SAVE = typeof window.showSaveFilePicker === 'function' && !IN_APP;
  var CAN_DIR = typeof window.showDirectoryPicker === 'function' && !IN_APP;
  var FIX_MAX = 3;          //  검사 불합격이면 틀린 것만 다시 보내고(받고) 다시 검사 — 이만큼까지
  var WAIT = 0, RUN = 1, DONE = 2, RETRY = 3, OK = 4, BAD = 5;

  // ── 도우미 ───────────────────────────────────────────────
  function human(b) {
    if (b < 1024) return Math.round(b) + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return b.toFixed(b < 10 ? 2 : b < 100 ? 1 : 0) + ' ' + u[i];
  }
  function comma(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function dur(s) {
    if (!isFinite(s) || s < 0) return '';
    s = Math.round(s);
    if (s < 60) return s + '초';
    if (s < 3600) return Math.floor(s / 60) + '분 ' + (s % 60) + '초';
    return Math.floor(s / 3600) + '시간 ' + Math.floor((s % 3600) / 60) + '분';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function day(t) { var d = new Date(t); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function qs(o) { return Object.keys(o).map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&'); }
  function sleep(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }
  function list10(a, n) { n = n || 10; return a.slice(0, n).join('\n') + (a.length > n ? '\n… 그 밖에 ' + (a.length - n) + '개' : ''); }
  var tt;
  function toast(m) { var t = $('toast'), d = $('dlg'); (d.open ? d : document.body).appendChild(t);   //  열린 창(dialog) 뒤에 가리지 않게
    t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 3200); }
  function api(method, url, body) {
    var o = { method: method, credentials: 'same-origin', headers: { 'Accept': 'application/json' } };
    if (body !== undefined) { o.body = JSON.stringify(body); o.headers['Content-Type'] = 'text/plain;charset=UTF-8'; }
    return fetch(url, o).then(function (r) {
      if (r.status === 401) { location.href = '/?next=' + encodeURIComponent('/bigfile'); throw new Error('로그인이 필요합니다'); }
      return r.text().then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { j = null; }
        if (!r.ok) { var e = new Error((j && j.error) || ('서버 답 ' + r.status + (r.status === 413 ? ' — 서버(nginx 등)가 너무 크다고 막았습니다' : ''))); e.status = r.status; e.data = j; throw e; }
        if (!j) throw new Error('서버가 JSON 대신 다른 것을 보냈습니다');
        return j;
      });
    });
  }
  //  CRC32 — 서버(bigfile-route.js)와 같은 계산
  var CRC_T = (function () { var t = new Int32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
  function crc32(u8) { var c = -1; for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return ~c >>> 0; }
  function hex8(n) { return ('0000000' + (n >>> 0).toString(16)).slice(-8); }
  //  조각 CRC 들을 이어 붙여 전체 CRC32 (zlib crc32_combine) — 파일을 처음부터 다시 읽지 않고
  function gf2(mat, vec) { var s = 0, i = 0; vec >>>= 0; while (vec) { if (vec & 1) s ^= mat[i]; vec >>>= 1; i++; } return s >>> 0; }
  function gf2sq(sq, mat) { for (var n = 0; n < 32; n++) sq[n] = gf2(mat, mat[n]); }
  function shift(crc1, len) {
    var even = new Uint32Array(32), odd = new Uint32Array(32), row = 1;
    odd[0] = 0xedb88320;
    for (var n = 1; n < 32; n++) { odd[n] = row; row <<= 1; }
    gf2sq(even, odd); gf2sq(odd, even);
    crc1 >>>= 0;
    while (len) {
      gf2sq(even, odd); if (len & 1) crc1 = gf2(even, crc1); len = Math.floor(len / 2); if (!len) break;
      gf2sq(odd, even); if (len & 1) crc1 = gf2(odd, crc1); len = Math.floor(len / 2);
    }
    return crc1;
  }
  var OPS = {};
  function wholeCrc(crcs, size, chunk) {
    var n = crcs.length;
    if (!size) return 0;
    var full = OPS[chunk];
    if (!full) { full = OPS[chunk] = new Uint32Array(32); for (var k = 0; k < 32; k++) full[k] = shift(1 << k, chunk); }
    var c = crcs[0] >>> 0;
    for (var i = 1; i < n; i++) {
      var len = Math.min(chunk, size - i * chunk);
      c = ((len === chunk ? gf2(full, c) : shift(c, len)) ^ crcs[i]) >>> 0;
    }
    return c;
  }
  function b64u32(b64, n) {
    var s = atob(b64 || ''), out = new Uint32Array(n);
    for (var i = 0; i < n; i++) out[i] = (s.charCodeAt(i * 4) | (s.charCodeAt(i * 4 + 1) << 8) | (s.charCodeAt(i * 4 + 2) << 16) | (s.charCodeAt(i * 4 + 3) << 24)) >>> 0;
    return out;
  }
  //  경로 손질 — 서버(cleanPath)와 같게
  //  이름은 올린 그대로 — 한글만 NFC 로 맞춘다(맥의 ㅎ+ㅏ+ㄴ → 한). 서버(cleanPath)와 같게.
  function cleanSeg(s) { return String(s).normalize('NFC').replace(/[\u0000-\u001f\u007f]/g, '').slice(0, 255); }
  function cleanPath(p) { return String(p || '').replace(/\\/g, '/').split('/').map(cleanSeg).filter(function (s) { return s !== ''; }).join('/'); }
  //  윈도에 못 쓰는 이름 — 받을 때 그 PC 에서만 바꿔 쓰고 검사표에 적는다(: * ? " < > | · 끝의 점·빈칸 · CON 같은 이름)
  function winSafe(s) {
    var t = s.replace(/[\\:*?"<>|]/g, '_').replace(/[. ]+$/, function (m) { return m.replace(/./g, '_'); });
    if (/^(con|prn|aux|nul|com\d|lpt\d)(\..*)?$/i.test(t)) t = '_' + t;
    return t;
  }
  function winSafePath(p) { return p.split('/').map(winSafe).join('/'); }
  //  폴더 수 — 파일이 든 하위 폴더까지 모두(탐색기 「폴더 n개」와 같은 셈)
  function allDirs(paths, empties) {
    var set = {};
    paths.forEach(function (p) { var sg = p.split('/'); for (var i = 1; i < sg.length; i++) set[sg.slice(0, i).join('/')] = 1; });
    (empties || []).forEach(function (p) { var sg = p.split('/'); for (var i = 1; i <= sg.length; i++) set[sg.slice(0, i).join('/')] = 1; });
    return Object.keys(set).sort();
  }
  //  한꺼번에 n 개까지 — 조각 보내기·받기는 SLOTS(전체에서 3개)를 나눠 쓴다
  function Sem(n) { this.n = n; this.q = []; }
  Sem.prototype.take = function () { var s = this; if (s.n > 0) { s.n--; return Promise.resolve(); } return new Promise(function (ok) { s.q.push(ok); }); };
  Sem.prototype.give = function () { if (this.q.length) this.q.shift()(); else this.n++; };
  function slot(fn) { return SLOTS.take().then(fn).then(function (v) { SLOTS.give(); return v; }, function (e) { SLOTS.give(); throw e; }); }
  function pool(items, k, fn, alive) {
    return new Promise(function (ok, no) {
      var i = 0, run = 0, err = null;
      function next() {
        if (err || !alive() || i >= items.length) { if (!run) { if (err) no(err); else ok(); } return; }
        var it = items[i++]; run++;
        Promise.resolve().then(function () { return fn(it); }).then(function () { run--; next(); }, function (e) { run--; err = err || e; next(); });
      }
      for (var t = 0; t < Math.max(1, Math.min(k, items.length)); t++) next();
    });
  }
  var ALWAYS = function () { return true; };
  //  내 PC 파일의 조각 CRC 를 읽어 낸다(전에 올린 것·맞춰 보기·이미 받은 것)
  function readCrcs(file, chunk, crcs, ck, onStep) {
    var n = crcs.length, i = 0;
    function step() {
      while (i < n && ck && ck[i]) i++;
      if (i >= n) return Promise.resolve();
      var k = i++;
      return file.slice(k * chunk, Math.min(file.size, (k + 1) * chunk)).arrayBuffer().then(function (b) {
        crcs[k] = crc32(new Uint8Array(b)); if (ck) ck[k] = 1; if (onStep) onStep(b.byteLength);
      }).then(step);
    }
    return step();
  }

  // ── 주고받는 한 줄 — 올리기·받기·검사·맞춰 보기 ───────────
  //   job = { kind:'up'|'down'|'check'|'cmp', name, folder, gid, files:[F], dirs:[], total, sent, state, ... }
  //   F   = { rel, file, size, lm, id, n, chunk, crcs, ck, sent, st:'wait'|'wait2'|'run'|'retry'|'done'|'ok'|'bad', cells? }
  function newJob(kind, name, folder) {
    var job = { kind: kind, name: name, folder: !!folder, files: [], dirs: [], total: 0, sent: 0, inflight: {}, state: 'wait', msg: '',
      xhrs: [], ctrls: [], samples: [], retries: 0, vdone: 0, vtotal: 0, round: 0 };
    JOBS.unshift(job);
    return job;
  }
  function mkFile(rel, file, size) { return { rel: rel, file: file, size: size, lm: file ? file.lastModified || 0 : 0, sent: 0, st: 'wait' }; }

          ['이 PC 에 못 쓰는 이름이라 바꿔 저장', Object.keys(renamed).length ? list10(Object.keys(renamed).map(function (k) { return k + ' → ' + renamed[k]; })) : '없음(이름 모두 그대로)', '—', null],
          ['수정한 날짜', '받은 날짜로 됨(브라우저는 날짜를 못 바꿈) — 원래 날짜가 필요하면 ZIP 으로 받기', '—', null],
          ['목록표에 없는 파일(받은 폴더에 원래 있던 것)', extra.length ? list10(extra) : '없음', '—', null],
          ['검사 불합격 → 다시 받음', job.fixLog ? job.fixLog.join('\n') : '없음', '—', null],
          ['걸린 시간 · 평균 속도', dur(sec) + ' · ' + human(job.total / Math.max(sec, 0.001)) + '/초', '—', null],
        ], '폴더의 파일 ' + job.files.length + '개를 빠짐없이, 서버와 똑같이 받았습니다', '받은 폴더가 서버와 다릅니다 — [다시 받기]를 눌러 주세요', ['받은 폴더', '포털 서버(목록표)']);
      });
    }
    srvEntriesFull(job, { gid: row.id }, true).then(function (s) {
      srv = s;
      s.entries.forEach(function (e) {
        if (e.d) { job.dirs.push(e.p); return; }
        var f = mkFile(e.p, null, e.s); f.p = e.p; f.id = e.id; prepFile(f, e); job.files.push(f);
      });
      job.total = job.files.reduce(function (a, f) { return a + f.size; }, 0);
      return root.getDirectoryHandle(s.name, { create: true });
    }).then(function (t) { top = t; job.msg = ''; return go(); })
      .catch(function (e) { job.state = 'error'; job.err = e.message || String(e); draw(job); });
  }

  // ── 맞춰 보기 — 내 PC 의 파일(폴더)을 서버 목록표와 하나하나: 크기·조각 CRC32 ──
  //   ZIP 으로 받아 푼 폴더·브라우저로 받은 파일이 빠짐없이 똑같은지 확인할 때. 파일은 내 PC 밖으로 안 나간다.
  function compareRow(row) {
    if (row.kind === 'group') {
      toast('받아서 풀어 둔 「' + row.name + '」 폴더를 골라 주세요');
      pickFolder({ kind: 'cmp', row: row });
    } else { PICK = { kind: 'cmp', row: row }; toast('받은 파일(' + row.name + ')을 골라 주세요'); $('pickF').click(); }
  }
  function runCompare(row, local, t) {
    t = t || {};
    var job = newJob('cmp', row.name, row.kind === 'group');
    job.t0 = Date.now(); job.state = 'verify'; job.vmsg = '서버 목록표를 받는 중'; draw(job);
    var target = row.kind === 'group' ? { gid: row.id } : { id: row.id, name: row.name, size: row.size };
    srvEntriesFull(job, target, false).then(function (s) {
      job.state = 'verify';
      var byRel = {}; local.forEach(function (x) { byRel[cleanPath(x.rel)] = x.file; });
      var srvFiles = s.entries.filter(function (e) { return !e.d; });
      var used = {};
      job.renamed = [];
      job.files = srvFiles.map(function (e) {
        var file = null;
        if (row.kind !== 'group') file = local[0] && local[0].file;
        else if (byRel[e.p]) { file = byRel[e.p]; used[e.p] = 1; }
        else { var w = winSafePath(e.p); if (w !== e.p && byRel[w]) { file = byRel[w]; used[w] = 1; job.renamed.push(e.p + ' → ' + w); } }   //  윈도에서 받으며 바뀐 이름
        var f = mkFile(e.p, file || null, e.s); f.e = e; return f;
      });
      if (row.kind === 'group') {
        var sd = allDirs(srvFiles.map(function (e) { return e.p; }), s.entries.filter(function (e) { return e.d; }).map(function (e) { return e.p; }));
        var ld = {}; allDirs(Object.keys(byRel), t.dirsKnown ? t.dirs : []).forEach(function (d) { ld[d] = 1; ld[winSafePath(d)] = 1; });
        job.srvDirs = sd; job.dirMiss = t.dirsKnown ? sd.filter(function (d) { return !ld[d] && !ld[winSafePath(d)]; }) : null;
      }
      if (job.files.length === 1) job.files[0].cells = new Uint8Array(srvFiles[0].n || 1);
      job.total = job.files.reduce(function (a, f) { return a + f.size; }, 0);
      job.vtotal = job.files.reduce(function (a, f) { return a + (f.file && f.file.size === f.size ? f.size : 0); }, 0); job.vdone = 0;
      job.vmsg = '내 PC 의 파일을 읽어 맞춰 보는 중';
      var known = {}; srvFiles.forEach(function (e) { known[e.p] = 1; });
      job.extra = row.kind === 'group' ? Object.keys(byRel).filter(function (p) { return !known[p] && !used[p]; }) : [];
      return pool(job.files, 2, function (f) {
        if (!f.file) { f.st = 'bad'; f.why = 'miss'; later(job); return; }
        if (f.file.size !== f.size) { f.st = 'bad'; f.why = 'size'; later(job); return; }
        f.st = 'run'; later(job);
        var c = new Uint32Array(f.e.n);
        return readCrcs(f.file, f.e.chunk, c, null, function (k) { job.vdone += k; later(job); }).then(function () {
          var sc = b64u32(f.e.crcs, f.e.n), d = 0;
          for (var i = 0; i < f.e.n; i++) { var same = sc[i] === c[i]; if (!same) d++; if (f.cells) f.cells[i] = same ? OK : BAD; }
          f.diff = d; f.st = d ? 'bad' : 'ok'; f.why = d ? 'crc' : ''; later(job);
        });
      }, ALWAYS);
    }).then(function () {
      var miss = [], size = [], crc = [], same = 0;
      job.files.forEach(function (f) {
        if (f.why === 'miss') miss.push(f.rel); else if (f.why === 'size') size.push(f.rel + ' (' + comma(f.file.size) + ' / ' + comma(f.size) + ')');
        else if (f.why === 'crc') crc.push(f.rel + ' (조각 ' + f.diff + '개 다름)'); else same++;
      });
      job.t1 = Date.now();
      var rows = [
        ['파일 수', (job.files.length - miss.length) + '개 있음', job.files.length + '개', !miss.length],
        ['내 PC 에 없는 파일', miss.length ? list10(miss) : '없음', '—', !miss.length],
        ['크기가 다른 파일', size.length ? list10(size) : '없음', '—', !size.length],
        ['내용(조각 CRC32)이 다른 파일', crc.length ? list10(crc) : same + '개 모두 같음', '—', !crc.length],
      ];
      if (row.kind === 'group') {
        if (job.dirMiss) rows.push(['폴더 수(하위 폴더 모두)', (job.srvDirs.length - job.dirMiss.length) + '개 있음', job.srvDirs.length + '개', !job.dirMiss.length],
          ['내 PC 에 없는 폴더', job.dirMiss.length ? list10(job.dirMiss) : '없음', '—', !job.dirMiss.length]);
        else rows.push(['폴더 수(하위 폴더 모두)', '빈 폴더는 알 수 없음(이 고르기 창은 빈 폴더를 안 알려 줌)', job.srvDirs.length + '개', null]);
        rows.push(['목록표에 없는 파일(내 PC 에만)', job.extra.length ? list10(job.extra) : '없음', '—', null]);
        if (job.renamed.length) rows.push(['윈도에 못 쓰는 이름이라 바뀐 것(같은 파일로 봄)', list10(job.renamed), '—', null]);
      }
      rows.push(['읽은 양 · 걸린 시간', human(job.vtotal) + ' · ' + dur((job.t1 - job.t0) / 1000), '—', null]);
      finish(job, rows, (row.kind === 'group' ? '내 PC 의 폴더에 파일 ' + job.files.length + '개가 빠짐없이, 서버와 똑같이 있습니다' : '내 PC 의 파일이 서버와 똑같습니다'),
        '내 PC 의 것이 서버와 다릅니다 — 다시 받아 주세요', ['내 PC', '포털 서버(목록표)']);
    }).catch(function (e) { job.state = 'error'; job.err = e.message || String(e); draw(job); });
  }

  // ── 목록의 [검사] — 서버의 파일(폴더)이 올릴 때 그대로인지 디스크에서 다시 읽어 ──
  function checkRow(row) {
    var job = newJob('check', row.name, row.kind === 'group');
    job.row = row; job.mine = !!row.mine; job.t0 = Date.now(); job.state = 'verify'; job.total = row.size; draw(job);
    var target = row.kind === 'group' ? { gid: row.id } : { id: row.id, name: row.name };
    serverVerify(job, target, true).then(function (r) {
      job.t1 = Date.now();
      if (row.kind === 'group') {
        finish(job, [
          ['파일 수', '—', r.files + '개 (빈 폴더 ' + r.dirs + '개)', null],
          ['서버에 없는 파일(목록표)', '—', r.missingCount ? list10(r.missing) : '없음', !r.missingCount],
          ['디스크 다시 읽기 — 조각 CRC32', '—', r.badCount ? list10(r.bad.map(function (b) { return b.p + (b.msg ? ' (' + b.msg + ')' : b.badCount ? ' (조각 ' + b.badCount + '개)' : ' (크기·전체 CRC 다름)'); })) : r.ok + '개 파일 모두 같음', !r.badCount],
          ['검사 시간', '—', dur((job.t1 - job.t0) / 1000), null],
        ], '서버의 폴더가 올릴 때 그대로입니다(파일 ' + r.files + '개)', '서버의 폴더가 올릴 때와 다릅니다 — ' + (job.mine ? '[다시 올려 고치기]로 틀린 것만 다시 보내세요' : '올린 사람에게 고쳐 달라고 해 주세요'), ['—', '지금 서버 디스크']);
      } else {
        var f = mkFile(row.name, null, row.size); f.cells = new Uint8Array(r.n);
        for (var i = 0; i < r.n; i++) f.cells[i] = OK;
        (r.bad || []).forEach(function (q) { f.cells[q] = BAD; });
        job.files = [f];
        row.reopen = r.badCount > 50 ? 'all' : r.bad.length ? r.bad.join(',') : String(r.n - 1);
        finish(job, [
          ['크기(바이트)', comma(r.size), comma(r.disk), r.size === r.disk],
          ['조각 CRC32', r.compared + '개 비교' + (r.filled ? ' (예전 조각 ' + r.filled + '개는 비교 값이 없어 이번에 채움)' : ''), r.badCount ? '틀린 조각 ' + r.badCount + '개: ' + r.bad.slice(0, 10).join(', ') : '모두 같음', !r.badCount],
          ['전체 CRC32', '—', r.crc, null],
          ['SHA-256', '—', r.sha256, null],
          ['검사 시간', '—', dur(r.ms / 1000), null],
        ], '서버의 파일이 올릴 때 그대로입니다', '서버의 파일이 올릴 때와 다릅니다 — ' + (job.mine ? '[다시 올려 고치기]로 틀린 조각만 다시 보내세요' : '올린 사람에게 다시 올려 달라고 해 주세요'), ['올릴 때 받은 값', '지금 서버 디스크']);
      }
      loadList();
    }).catch(function (e) { job.state = 'error'; job.err = e.message || String(e); draw(job); });
  }
  //  고치기·이어 올리기 — 내 PC 의 같은 파일·폴더를 고르면 틀리거나 빠진 것만 보내고 다시 검사
  function fixFrom(row) {
    if (row.kind === 'group') {
      toast('내 PC 에서 같은 폴더(' + row.name + ')를 골라 주세요 — 빠지거나 틀린 것만 보냅니다');
      pickFolder({ gid: row.id, row: row });
    } else {
      PICK = { kind: 'fix', row: row, reopen: row.reopen || null }; toast('내 PC 에서 같은 파일(' + row.name + ')을 골라 주세요'); $('pickF').click();
    }
  }

  // ── 목록 ─────────────────────────────────────────────────
  function loadInfo() {
    return api('GET', '/bigfile/api/info').then(function (r) {
      INFO = r;
      if (!SLOTS) SLOTS = new Sem(r.parallel || 3);
      $('who').textContent = r.user + ' 님';
      $('tabAll').hidden = !r.admin;
      $('limits').textContent = '폴더는 하위 폴더·빈 폴더까지 그대로 · 파일 하나 ' + human(r.max) + ' 까지 · 끊기면 같은 것을 다시 고르면 이어 올림 · 다 올리면 빠진 파일 없는지 자동 검사';
      var s = [];
      s.push('내가 쓰는 자리 ' + human(r.used) + (r.quota ? ' / ' + human(r.quota) : ''));
      if (r.free >= 0) s.push('서버 남은 자리 ' + human(r.free));
      s.push('다 못 올린 것은 ' + r.partDays + '일 뒤 지워집니다');
      if (r.keepDays) s.push('올린 것은 ' + r.keepDays + '일 동안 보관');
      s.push(CAN_DIR ? '받기: 고른 폴더에 바로(받으면서 검사)' : '받기: 폴더는 ZIP 으로(받은 뒤 [맞춰 보기]로 검사)');
      $('foot').textContent = s.join(' · ');
    });
  }
  function loadList() {
    return api('GET', '/bigfile/api/list' + (TAB === 'all' ? '?all=1' : '')).then(function (r) { FILES = r.files; drawList(); })
      .catch(function (e) { toast(e.message); });
  }
  var OPEN = {};
  function drawList() {
    var q = $('q').value.trim().toLowerCase();
    var rows = FILES.filter(function (f) {
      if (TAB === 'mine' && !f.mine) return false;
      if (TAB === 'pub' && !f.pub) return false;
      return !q || (f.name + ' ' + f.owner).toLowerCase().indexOf(q) >= 0;
    });
    var up = {}; JOBS.forEach(function (j) { if (j.kind === 'up' && j.state !== 'done') { if (j.gid) up[j.gid] = 1; if (!j.folder && j.files[0] && j.files[0].id) up[j.files[0].id] = 1; } });
    $('empty').hidden = rows.length > 0;
    $('list').innerHTML = rows.map(function (f) {
      var part = f.state !== 'done', g = f.kind === 'group';
      var pct = g ? (f.size ? Math.floor(f.gotBytes / f.size * 100) : 0) : Math.floor(f.got / f.n * 100);
      var tags = (g ? '<span class="tag">[폴더 · 파일 ' + f.nfiles + '개 · 하위 폴더 ' + f.nfolders + '개' + (f.ndirs ? '(빈 폴더 ' + f.ndirs + ')' : '') + ']</span>' : '') +
        (f.pub ? '<span class="tag">[사내 공개]</span>' : '') + (f.shares.length ? '<span class="tag">[링크 ' + f.shares.length + ']</span>' : '') +
        (f.v ? (f.v.ok ? '<span class="tag vok" title="' + day(f.v.at) + ' 검사">[검사 합격]</span>' : '<span class="tag vbad">[검사 불합격]</span>') : '') +
        (part ? '<span class="tag part">[' + (up[f.id] ? '올리는 중' : '다 못 올림 ' + pct + '%') + ']</span>' : '');
      var mine = f.mine || INFO.admin;
      var act = part
        ? (up[f.id] || !f.mine ? '' : '<button data-a="resume" data-id="' + f.id + '">이어 올리기</button>') + (mine ? '<button data-a="del" data-id="' + f.id + '">삭제</button>' : '')
        : '<button class="pri" data-a="dl" data-id="' + f.id + '" title="' + (g ? (CAN_DIR ? '고른 폴더에 받으면서 검사' : 'ZIP 으로 받기') : (CAN_SAVE ? '받으면서 조각마다 검사' : '브라우저로 받기')) + '">받기</button>' +
          '<button data-a="cmp" data-id="' + f.id + '" title="내 PC 의 받은 파일·폴더가 서버와 똑같은지 하나하나 맞춰 봄">맞춰 보기</button>' +
          '<button data-a="check" data-id="' + f.id + '" title="서버의 것이 올릴 때 그대로인지 디스크에서 다시 읽어 검사">검사</button>' +
          (g ? '<button data-a="open" data-id="' + f.id + '">' + (OPEN[f.id] ? '내용 닫기' : '내용') + '</button>' : '') +
          (mine ? '<button data-a="share" data-id="' + f.id + '" title="로그인 없이 받는 링크">링크</button>' +
            '<button data-a="pub" data-id="' + f.id + '" title="로그인한 직원 누구나 받게">' + (f.pub ? '공개 끄기' : '사내 공개') + '</button>' +
            '<button data-a="del" data-id="' + f.id + '">삭제</button>' : '') +
          '<div class="muted" style="margin-top:2px"><a href="' + (g ? '/bigfile/api/group/' + f.id + '/zip' : '/bigfile/api/file/' + f.id + '/dl') + '" download>' + (g ? 'ZIP 으로 받기' : '브라우저로 바로 받기') + '</a></div>';
      return '<tr><td class="n">' + esc(f.name) + tags + '</td><td class="r">' + human(f.size) + '</td><td class="r">' + day(f.t1 || f.t0) +
        '</td><td>' + esc(f.owner) + '</td><td class="r">' + (part ? '' : f.dl + '번 받음') + '</td><td class="a">' + act + '</td></tr>' +
        (g && OPEN[f.id] ? '<tr class="sub"><td colspan="6" id="in_' + f.id + '">읽는 중…</td></tr>' : '');
    }).join('');
    rows.forEach(function (f) { if (f.kind === 'group' && OPEN[f.id]) showInside(f); });
  }
  //  폴더 내용 — 탐색기처럼 폴더·파일을 모두(1000개씩 더 보기) + 원본과 대어 볼 목록(CSV)
  var SHOWN = {};
  function showInside(f) {
    api('GET', '/bigfile/api/group/' + f.id).then(function (g) {
      var td = $('in_' + f.id); if (!td) return;
      var files = g.entries.filter(function (e) { return !e.d; }), empt = {};
      g.entries.forEach(function (e) { if (e.d) empt[e.p] = 1; });
      var items = allDirs(files.map(function (e) { return e.p; }), Object.keys(empt)).map(function (p) { return { p: p, d: 1 }; }).concat(files)
        .sort(function (a, b) { return a.p < b.p ? -1 : a.p > b.p ? 1 : 0; });
      var n = SHOWN[f.id] || 1000, shown = items.slice(0, n);
      td.innerHTML = '<div class="muted" style="padding:6px 0">파일 ' + files.length + '개 · 하위 폴더 ' + (items.length - files.length) + '개(빈 폴더 ' + Object.keys(empt).length + '개) · ' +
        comma(g.size) + ' 바이트 · <a href="/bigfile/api/group/' + f.id + '/list.csv">목록 받기(엑셀)</a> — 원본 폴더와 하나하나 대어 보려면 [맞춰 보기]</div>' +
        '<table class="inside">' + shown.map(function (e) {
          var dep = e.p.split('/').length - 1, nm = e.p.slice(e.p.lastIndexOf('/') + 1);
          return '<tr><td style="padding-left:' + (4 + dep * 16) + 'px">' + (e.d ? '<b>' + esc(nm) + '/</b>' : esc(nm)) + '</td><td class="r">' +
            (e.d ? (empt[e.p] ? '빈 폴더' : '폴더') : comma(e.s) + ' 바이트' + (e.state === 'done' ? '' : ' · 아직')) + '</td><td class="r">' +
            (!e.d && e.state === 'done' ? '<a href="/bigfile/api/file/' + e.id + '/dl" download>받기</a>' : '') + '</td></tr>';
        }).join('') + '</table>' + (items.length > n ? '<div style="padding:6px 0"><button data-a="more" data-id="' + f.id + '">더 보기 (남은 ' + (items.length - n) + '개)</button></div>' : '');
    });
  }

  $('list').onclick = function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var f = FILES.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!f) return;
    var a = b.dataset.a, g = f.kind === 'group';
    if (a === 'del') {
      if (!confirm(f.name + (g ? ' 폴더(파일 ' + f.nfiles + '개)' : '') + ' 을(를) 지울까요?\n지우면 공유 링크도 더는 안 됩니다.')) return;
      api('DELETE', g ? '/bigfile/api/group/' + f.id : '/bigfile/api/file/' + f.id).then(function () { toast('지웠습니다'); loadList(); loadInfo(); }, function (er) { toast(er.message); });
    } else if (a === 'pub') {
      api('POST', '/bigfile/api/pub/' + (g ? 'g/' : '') + f.id + '?on=' + (f.pub ? 0 : 1)).then(function () { toast(f.pub ? '사내 공개를 껐습니다' : '로그인한 직원 누구나 받을 수 있습니다'); loadList(); }, function (er) { toast(er.message); });
    } else if (a === 'resume') fixFrom(f);
    else if (a === 'share') openShare(f);
    else if (a === 'dl') { downloadRow(f); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'cmp') { compareRow(f); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'check') { checkRow(f); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'open') { OPEN[f.id] = !OPEN[f.id]; drawList(); }
    else if (a === 'more') { SHOWN[f.id] = (SHOWN[f.id] || 1000) + 1000; showInside(f); }
  };
  $('tabs').onclick = function (e) {
    var b = e.target.closest('button[data-t]'); if (!b) return;
    TAB = b.dataset.t;
    [].forEach.call(document.querySelectorAll('#tabs button[data-t]'), function (x) { x.classList.toggle('on', x === b); });
    loadList();
  };
  $('q').oninput = drawList;
  $('reload').onclick = function () { loadInfo(); loadList(); };

  // ── 공유 링크 ────────────────────────────────────────────
  var DF = null, dlg = $('dlg');
  function openShare(f) {
    DF = f; $('dName').textContent = '링크 — ' + f.name + (f.kind === 'group' ? ' (폴더)' : '');
    $('dDays').innerHTML = [1, 3, 7, 14, 30].filter(function (d) { return d <= (INFO.shareDaysMax || 30); })
      .map(function (d) { return '<option value="' + d + '"' + (d === 7 ? ' selected' : '') + '>' + d + '일</option>'; }).join('');
    drawLinks();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function sharePath() { return (DF.kind === 'group' ? 'g/' : '') + DF.id; }
  function drawLinks() {
    var base = location.origin + '/bigfile/s/';
    $('dLinks').innerHTML = DF.shares.length ? DF.shares.map(function (s) {
      return '<div class="lk"><input readonly value="' + esc(base + s.tok) + '"><button data-c="1">복사</button><button data-x="' + esc(s.tok) + '">끊기</button>' +
        '<div class="muted" style="width:100%">' + day(s.exp) + ' 까지 · ' + (s.max ? s.used + ' / ' + s.max + '번 받음' : s.used + '번 받음') + '</div></div>';
    }).join('') : '<div class="muted" style="padding:6px 0">아직 만든 링크가 없습니다</div>';
  }
  function copy(text, input) {
    function old() { input.select(); try { document.execCommand('copy'); toast('링크를 복사했습니다'); } catch (e) { toast('복사가 안 됩니다 — 직접 선택해 복사하세요'); } }
    //  http(사내 주소)로 열면 navigator.clipboard 가 없거나 거절된다 — 옛 방식으로
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { toast('링크를 복사했습니다'); }, old);
    old();
  }
  $('dLinks').onclick = function (e) {
    var c = e.target.closest('button[data-c]');
    if (c) { var inp = c.parentNode.querySelector('input'); copy(inp.value, inp); return; }
    var x = e.target.closest('button[data-x]');
    if (x && confirm('이 링크를 끊을까요? 받은 사람도 더는 못 받습니다.')) {
      api('DELETE', '/bigfile/api/share/' + sharePath() + '/' + encodeURIComponent(x.dataset.x)).then(function (r) { DF = Object.assign({}, DF, r.file); drawLinks(); loadList(); }, function (er) { toast(er.message); });
    }
  };
  $('dMake').onclick = function () {
    api('POST', '/bigfile/api/share/' + sharePath() + '?days=' + $('dDays').value + '&max=' + $('dMax').value).then(function (r) {
      DF = Object.assign({}, DF, r.file); drawLinks(); loadList();
      var inp = $('dLinks').querySelector('.lk:last-child input'); if (inp) copy(inp.value, inp);
    }, function (er) { toast(er.message); });
  };
  $('dClose').onclick = function () { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); };

  //  시험용 — 점검 도구가 계산을 맞춰 본다
  window.__bigfile = { crc32: crc32, wholeCrc: wholeCrc };
  loadInfo().then(loadList).catch(function (e) { toast(e.message); });
})();
</script>
</body>
</html>
