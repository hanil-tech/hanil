<!doctype html>
<html lang="ko" data-notheme="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대용량 파일 — 한일</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--fg:#1d2433;--sub:#6a7385;--line:#e3e7ef;--acc:#1f5eff;--acc2:#e8eeff;--ok:#1a7f37;--ok2:#e6f4e6;--bad:#b3261e;--bad2:#fdeeee;--warn:#d97a00;--bar:#dfe5f1;--chk:#0f8a8a;
  --c-wait:#dfe5f1;--c-run:#1f5eff;--c-done:#7fb4ff;--c-retry:#f08c00;--c-ok:#2da44e;--c-bad:#d1242f}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--fg:#e6e9f0;--sub:#9aa3b5;--line:#2c3346;--acc:#5b8cff;--acc2:#24304f;--ok:#4cc26b;--ok2:#17301f;--bad:#ff7a70;--bad2:#3a1d1d;--warn:#e0a040;--bar:#2c3346;--chk:#3cc4c4;
  --c-wait:#2c3346;--c-run:#5b8cff;--c-done:#34528f;--c-retry:#e0a040;--c-ok:#3fb950;--c-bad:#ff6a69}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:20px;margin:0;flex:1}
header .who{color:var(--sub);font-size:13px}
.home{text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
#drop{border:2px dashed var(--line);border-radius:12px;padding:28px 12px;text-align:center;cursor:pointer;transition:.15s}
#drop.on{border-color:var(--acc);background:var(--acc2)}
#drop .big{font-size:36px}
#drop b{font-size:16px}
#drop .sub{color:var(--sub);font-size:13px;margin-top:4px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}

/* ── 주고받는 줄 ── */
.up{border-top:1px solid var(--line);padding:12px 0}
.up:first-child{border-top:0}
.up .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.up .nm{flex:1;min-width:160px;font-weight:600;word-break:break-all}
.up .dir{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--acc2);color:var(--acc)}
.up .dir.down{background:var(--ok2);color:var(--ok)}
.up .dir.check{background:#e0f4f4;color:var(--chk)}
@media (prefers-color-scheme:dark){.up .dir.check{background:#123333}}
.up .st{color:var(--sub);font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.st.bad{color:var(--bad)}.st.ok{color:var(--ok)}

/* 그림 — 내 PC ⇄ 포털 서버 */
.flow{display:flex;align-items:center;gap:8px;margin:10px 0 6px}
.node{width:76px;flex:none;text-align:center;font-size:12px;color:var(--sub)}
.node .ic{font-size:28px;line-height:1.2;display:block;transition:transform .3s}
.flow.run .node.to .ic{animation:bump 1s ease-in-out infinite}
@keyframes bump{50%{transform:scale(1.08)}}
.pipe{flex:1;position:relative;height:30px;border-radius:15px;background:var(--bar);overflow:hidden}
.pipe .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--c-done),var(--c-run));opacity:.35;transition:width .3s}
.flow.down .pipe .fill{inset:0 0 0 auto;background:linear-gradient(270deg,var(--c-ok),var(--c-ok));}
.pipe .dots{position:absolute;inset:0;
  background-image:radial-gradient(circle at 50% 50%,var(--c-run) 0 5px,transparent 6px);
  background-size:34px 30px;background-repeat:repeat-x;opacity:0;transition:opacity .3s}
.flow.down .pipe .dots{background-image:radial-gradient(circle at 50% 50%,var(--c-ok) 0 5px,transparent 6px)}
.flow.check .pipe .dots{background-image:radial-gradient(circle at 50% 50%,var(--chk) 0 4px,transparent 5px);background-size:22px 30px}
.flow.run .pipe .dots{opacity:1;animation:flowR .8s linear infinite}
.flow.run.down .pipe .dots{animation-name:flowL}
.flow.run.check .pipe .dots{animation-duration:1.6s}
@keyframes flowR{from{background-position:0 0}to{background-position:34px 0}}
@keyframes flowL{from{background-position:34px 0}to{background-position:0 0}}
.pipe .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--fg);text-shadow:0 0 4px var(--card),0 0 4px var(--card);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.flow.fail .pipe{background:var(--bad2)}
.flow.good .pipe{background:var(--ok2)}
.flow.good .pipe .fill{background:var(--c-ok)}

/* 조각 지도 */
canvas.map{display:block;width:100%;height:auto;margin-top:4px;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* 검사 결과표 */
.rep{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rep .hd{padding:10px 12px;font-weight:700}
.rep .hd.ok{background:var(--ok2);color:var(--ok)}
.rep .hd.bad{background:var(--bad2);color:var(--bad)}
.rep table{width:100%;border-collapse:collapse;font-size:12.5px}
.rep td,.rep th{padding:6px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.rep th{color:var(--sub);font-weight:600;background:var(--bg)}
.rep td.v{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.rep td.k{white-space:nowrap;font-weight:600}
.rep td.j{white-space:nowrap;text-align:center;width:44px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tabs button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.tabs input{flex:1;min-width:140px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
#ftab{width:100%;border-collapse:collapse}
#ftab th,#ftab td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
#ftab th{color:var(--sub);font-weight:600;font-size:12.5px;border-top:0}
#ftab td.n{word-break:break-all;font-weight:600}
#ftab td.r,#ftab th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#ftab td.a{white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.pub{background:#e6f4e6;color:#1a7f37}.tag.part{background:#fff4d6;color:#9a6700}.tag.lnk{background:var(--acc2);color:var(--acc)}
.tag.vok{background:#e0f4f4;color:#0f7a7a}.tag.vbad{background:var(--bad2);color:var(--bad)}
@media (prefers-color-scheme:dark){.tag.pub{background:#18361f;color:#7fdc95}.tag.part{background:#3a3016;color:#e9c46a}.tag.vok{background:#123333;color:#6fdada}}
.muted{color:var(--sub);font-size:12.5px}
.empty{text-align:center;color:var(--sub);padding:26px 0}
footer{color:var(--sub);font-size:12.5px;text-align:center;margin:8px 0 30px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:18px;max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:#0006}
dialog h3{margin:0 0 6px;font-size:16px;word-break:break-all}
dialog label{display:inline-flex;gap:6px;align-items:center;margin:6px 12px 6px 0}
dialog select{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.lk{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.lk input{flex:1;min-width:180px;font:12.5px monospace;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:10}
#toast.on{opacity:1}
/* 폰 — 파일 표를 카드처럼 */
@media (max-width:700px){
  #ftab thead{display:none}
  #ftab,#ftab tbody,#ftab tr,#ftab td{display:block;width:100%}
  #ftab tr{border-top:1px solid var(--line);padding:8px 0}
  #ftab td{border:0;padding:2px 0;text-align:left!important}
  #ftab td.r{display:inline-block;width:auto;margin-right:10px;color:var(--sub);font-size:12.5px}
  #ftab td.a{white-space:normal;margin-top:4px}
  .node{width:58px}.node .ic{font-size:24px}
  /* 검사 결과표 — 한 항목을 여러 줄로 */
  .rep tr.h{display:none}
  .rep table,.rep tbody,.rep tr,.rep td{display:block;width:100%}
  .rep tr{position:relative;border-top:1px solid var(--line);padding:6px 10px}
  .rep td{border:0;padding:1px 0}
  .rep td.k{padding-right:40px}
  .rep td.j{position:absolute;top:6px;right:8px;width:auto}
  .rep td.v[data-l]::before{content:attr(data-l) " ";color:var(--sub);font-family:system-ui,sans-serif;font-size:11.5px}
  .rep td.v.e{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📦 대용량 파일</h1>
    <span class="who" id="who"></span>
    <a class="home" href="/">← 포털</a>
  </header>

  <div class="card">
    <div id="drop" tabindex="0" role="button">
      <div class="big">⬆</div>
      <b>여기에 파일을 끌어다 놓거나 눌러서 고르세요</b>
      <div class="sub" id="limits">설치할 것 없이 브라우저에서 바로 — 여러 개를 한꺼번에 골라도 됩니다</div>
    </div>
    <input type="file" id="pick" multiple hidden>
    <div id="ups"></div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs">
      <button data-t="mine" class="on">내 파일</button>
      <button data-t="pub">사내 공개</button>
      <button data-t="all" id="tabAll" hidden>전체(관리자)</button>
      <input id="q" type="search" placeholder="이름·올린 사람 찾기">
      <button id="reload" title="새로 고침">↻</button>
    </div>
    <table id="ftab">
      <thead><tr><th>이름</th><th class="r">크기</th><th class="r">올린 날</th><th>올린 사람</th><th class="r">받음</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
    <div class="empty" id="empty" hidden>파일이 없습니다</div>
  </div>
  <footer id="foot"></footer>
</div>

<dialog id="dlg">
  <h3 id="dName"></h3>
  <div class="muted">로그인 없이 받을 수 있는 링크입니다. 거래처 등 바깥 사람에게 보낼 때 쓰세요.</div>
  <div style="margin:10px 0">
    <label>기한 <select id="dDays"><option value="1">1일</option><option value="3">3일</option><option value="7" selected>7일</option><option value="14">14일</option><option value="30">30일</option></select></label>
    <label>받는 횟수 <select id="dMax"><option value="0">제한 없음</option><option value="1">1번</option><option value="3">3번</option><option value="5">5번</option><option value="10">10번</option></select></label>
    <button class="pri" id="dMake">🔗 링크 만들기</button>
  </div>
  <div id="dLinks"></div>
  <div style="text-align:right;margin-top:10px"><button id="dClose">닫기</button></div>
</dialog>
<div id="toast"></div>

<script>
'use strict';
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var INFO = null, FILES = [], TAB = 'mine', UPS = [], RUNNING = false, RESUME_FOR = null, FIX_FOR = null;
  var FIX_MAX = 3;          //  검사 불합격이면 틀린 조각만 다시 보내고 다시 검사 — 이만큼까지
  var IN_APP = /HanilPortalApp\//.test(navigator.userAgent);
  //  화면 안에서 받기(그림·검사) — 고른 자리에 바로 쓰는 기능(크롬·엣지, https 또는 localhost)이 없으면
  //  받은 것을 브라우저가 들고 있다가 한 번에 저장한다 → 그때는 크기를 제한(그보다 크면 보통 내려받기)
  var BLOB_MAX = IN_APP ? 50 * 1048576 : 2 * 1073741824;
  //  조각 상태 → 지도 색
  var WAIT = 0, RUN = 1, DONE = 2, RETRY = 3, OK = 4, BAD = 5;

  // ── 도우미 ───────────────────────────────────────────────
  function human(b) {
    if (b < 1024) return b + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return b.toFixed(b < 10 ? 2 : b < 100 ? 1 : 0) + ' ' + u[i];
  }
  function comma(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function dur(s) {
    if (!isFinite(s) || s < 0) return '';
    s = Math.round(s);
    if (s < 60) return s + '초';
    if (s < 3600) return Math.floor(s / 60) + '분 ' + (s % 60) + '초';
    return Math.floor(s / 3600) + '시간 ' + Math.floor((s % 3600) / 60) + '분';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function day(t) { var d = new Date(t); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function qs(o) { return Object.keys(o).map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&'); }
  function sleep(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }
  var tt;
  function toast(m) { var t = $('toast'), d = $('dlg'); (d.open ? d : document.body).appendChild(t);   //  열린 창(dialog) 뒤에 가리지 않게
     t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 2600); }
  function api(method, url) {
    return fetch(url, { method: method, credentials: 'same-origin', headers: { 'Accept': 'application/json' } }).then(function (r) {
      if (r.status === 401) { location.href = '/?next=' + encodeURIComponent('/bigfile'); throw new Error('로그인이 필요합니다'); }
      return r.text().then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { j = null; }
        if (!r.ok) throw new Error((j && j.error) || ('서버 답 ' + r.status + (r.status === 413 ? ' — 서버(nginx 등)가 조각을 너무 크다고 막았습니다' : '')));
        if (!j) throw new Error('서버가 JSON 대신 다른 것을 보냈습니다');
        return j;
      });
    });
  }
  //  CRC32 — 서버(bigfile-route.js)와 같은 계산
  var CRC_T = (function () { var t = new Int32Array(256); for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; } return t; })();
  function crc32(u8) { var c = -1; for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xff] ^ (c >>> 8); return ~c >>> 0; }
  function hex8(n) { return ('0000000' + (n >>> 0).toString(16)).slice(-8); }
  //  조각 CRC 들을 이어 붙여 전체 CRC32 를 낸다(zlib crc32_combine) — 파일을 처음부터 다시 읽지 않고
  function gf2(mat, vec) { var s = 0, i = 0; vec >>>= 0; while (vec) { if (vec & 1) s ^= mat[i]; vec >>>= 1; i++; } return s >>> 0; }
  function gf2sq(sq, mat) { for (var n = 0; n < 32; n++) sq[n] = gf2(mat, mat[n]); }
  function shiftOp(len) {          //  「뒤에 len 바이트가 더 붙었다」를 나타내는 32×32 행렬
    var M = new Uint32Array(32);
    for (var k = 0; k < 32; k++) M[k] = shift(1 << k, len);
    return M;
  }
  function shift(crc1, len) {
    var even = new Uint32Array(32), odd = new Uint32Array(32), row = 1;
    odd[0] = 0xedb88320;
    for (var n = 1; n < 32; n++) { odd[n] = row; row <<= 1; }
    gf2sq(even, odd); gf2sq(odd, even);
    crc1 >>>= 0;
    while (len) {
      gf2sq(even, odd);
      if (len & 1) crc1 = gf2(even, crc1);
      len = Math.floor(len / 2);
      if (!len) break;
      gf2sq(odd, even);
      if (len & 1) crc1 = gf2(odd, crc1);
      len = Math.floor(len / 2);
    }
    return crc1;
  }
  function wholeCrc(crcs, size, chunk) {
    var n = crcs.length;
    if (!size) return 0;
    var full = shiftOp(chunk), c = crcs[0] >>> 0;
    for (var i = 1; i < n; i++) {
      var len = Math.min(chunk, size - i * chunk);
      c = ((len === chunk ? gf2(full, c) : shift(c, len)) ^ crcs[i]) >>> 0;
    }
    return c;
  }
  function b64u32(b64, n) {
    var s = atob(b64 || ''), out = new Uint32Array(n);
    for (var i = 0; i < n; i++) out[i] = (s.charCodeAt(i * 4) | (s.charCodeAt(i * 4 + 1) << 8) | (s.charCodeAt(i * 4 + 2) << 16) | (s.charCodeAt(i * 4 + 3) << 24)) >>> 0;
    return out;
  }
  function copy(text, input) {
    function old() { input.select(); try { document.execCommand('copy'); toast('링크를 복사했습니다'); } catch (e) { toast('복사가 안 됩니다 — 직접 선택해 복사하세요'); } }
    //  http(사내 주소)로 열면 navigator.clipboard 가 없거나 거절된다 — 옛 방식으로
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { toast('링크를 복사했습니다'); }, old);
    old();
  }

  // ── 주고받는 한 줄(올리기·받기·검사) ─────────────────────
  //   it = { dir:'up'|'down'|'check', name, size, n, chunk, cells(조각 상태), state, ... }
  function newItem(dir, name, size) {
    var it = { dir: dir, name: name, size: size, sent: 0, inflight: {}, state: 'wait', msg: '', xhrs: [], ctrls: [], samples: [], retries: 0, vdone: 0 };
    UPS.unshift(it);
    drawUp(it);
    return it;
  }
  function setCells(it, n, chunk) {
    if (it.cells && it.cells.length === n) return;
    it.n = n; it.chunk = chunk; it.cells = new Uint8Array(n);
  }
  function mark(it, i, st) { if (it.cells) { it.cells[i] = st; later(it); } }
  function later(it) { if (!it._raf) it._raf = setTimeout(function () { it._raf = 0; drawUp(it); }, 200); }
  //  속도 — 최근 8초 동안 오간 양으로
  function tick(it) {
    var now = Date.now(), done = it.sent;
    for (var k in it.inflight) done += it.inflight[k];
    it.cur = Math.min(done, it.size);
    it.samples.push([now, it.cur]);
    while (it.samples.length > 2 && now - it.samples[0][0] > 8000) it.samples.shift();
    later(it);
  }
  function speed(it) {
    var sm = it.samples;
    return sm.length > 1 ? (sm[sm.length - 1][1] - sm[0][1]) / Math.max(0.001, (sm[sm.length - 1][0] - sm[0][0]) / 1000) : 0;
  }
  var DIRNAME = { up: '⬆ 올리기', down: '⬇ 받기', check: '🔍 서버 검사' };

      var part = f.state !== 'done';
      var tags = (f.pub ? '<span class="tag pub">사내 공개</span>' : '') + (f.shares.length ? '<span class="tag lnk">링크 ' + f.shares.length + '</span>' : '') +
        (f.v ? (f.v.ok ? '<span class="tag vok" title="' + day(f.v.at) + ' 검사">검사 ✓</span>' : '<span class="tag vbad">검사 ✕</span>') : '') +
        (part ? '<span class="tag part">' + (up[f.id] ? '올리는 중' : '다 못 올림 ' + Math.floor(f.got / f.n * 100) + '%') + '</span>' : '');
      var act = part
        ? (up[f.id] ? '' : '<button data-a="resume" data-id="' + f.id + '">▶ 이어 올리기</button>') + '<button data-a="del" data-id="' + f.id + '">🗑</button>'
        : '<button class="pri" data-a="dl" data-id="' + f.id + '" title="받으면서 조각마다 검사">⬇ 받기</button>' +
          '<button data-a="check" data-id="' + f.id + '" title="서버의 파일이 올릴 때 그대로인지 다시 읽어 검사">🔍</button>' +
          (f.mine || INFO.admin ? '<button data-a="share" data-id="' + f.id + '" title="바깥 사람용 링크">🔗</button>' +
            '<button data-a="pub" data-id="' + f.id + '" title="' + (f.pub ? '사내 공개 끄기' : '로그인한 직원 누구나 받게') + '">' + (f.pub ? '🔒' : '🏢') + '</button>' +
            '<button data-a="del" data-id="' + f.id + '" title="지우기">🗑</button>' : '') +
          '<div class="muted" style="margin-top:2px"><a href="/bigfile/api/file/' + f.id + '/dl" download>브라우저로 바로 받기</a></div>';
      return '<tr><td class="n">' + esc(f.name) + tags + '</td><td class="r">' + human(f.size) + '</td><td class="r">' + day(f.t1 || f.t0) +
        '</td><td>' + esc(f.owner) + '</td><td class="r">' + (part ? '' : f.dl + '번 받음') + '</td><td class="a">' + act + '</td></tr>';
    }).join('');
  }
  $('list').onclick = function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var f = FILES.filter(function (x) { return x.id === b.dataset.id; })[0]; if (!f) return;
    var a = b.dataset.a;
    if (a === 'del') {
      if (!confirm(f.name + ' 을(를) 지울까요?\n지우면 공유 링크도 더는 안 됩니다.')) return;
      api('DELETE', '/bigfile/api/file/' + f.id).then(function () { toast('지웠습니다'); loadList(); loadInfo(); }, function (er) { toast(er.message); });
    } else if (a === 'pub') {
      api('POST', '/bigfile/api/pub/' + f.id + '?on=' + (f.pub ? 0 : 1)).then(function () { toast(f.pub ? '사내 공개를 껐습니다' : '로그인한 직원 누구나 받을 수 있습니다'); loadList(); }, function (er) { toast(er.message); });
    } else if (a === 'resume') {
      RESUME_FOR = f; toast('올리다 만 파일(' + f.name + ')을 다시 골라 주세요'); pick.click();
    } else if (a === 'share') openShare(f);
    else if (a === 'dl') { download(f); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (a === 'check') { checkFile(f, true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  };
  $('tabs').onclick = function (e) {
    var b = e.target.closest('button[data-t]'); if (!b) return;
    TAB = b.dataset.t;
    [].forEach.call(document.querySelectorAll('#tabs button[data-t]'), function (x) { x.classList.toggle('on', x === b); });
    loadList();
  };
  $('q').oninput = drawList;
  $('reload').onclick = function () { loadInfo(); loadList(); };

  // ── 공유 링크 ────────────────────────────────────────────
  var DF = null, dlg = $('dlg');
  function openShare(f) {
    DF = f; $('dName').textContent = '🔗 ' + f.name;
    $('dDays').innerHTML = [1, 3, 7, 14, 30].filter(function (d) { return d <= (INFO.shareDaysMax || 30); })
      .map(function (d) { return '<option value="' + d + '"' + (d === 7 ? ' selected' : '') + '>' + d + '일</option>'; }).join('');
    drawLinks();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function drawLinks() {
    var base = location.origin + '/bigfile/s/';
    $('dLinks').innerHTML = DF.shares.length ? DF.shares.map(function (s) {
      return '<div class="lk"><input readonly value="' + esc(base + s.tok) + '"><button data-c="1">복사</button><button data-x="' + esc(s.tok) + '">끊기</button>' +
        '<div class="muted" style="width:100%">' + day(s.exp) + ' 까지 · ' + (s.max ? s.used + ' / ' + s.max + '번 받음' : s.used + '번 받음') + '</div></div>';
    }).join('') : '<div class="muted" style="padding:6px 0">아직 만든 링크가 없습니다</div>';
  }
  $('dLinks').onclick = function (e) {
    var c = e.target.closest('button[data-c]');
    if (c) { var inp = c.parentNode.querySelector('input'); copy(inp.value, inp); return; }
    var x = e.target.closest('button[data-x]');
    if (x && confirm('이 링크를 끊을까요? 받은 사람도 더는 못 받습니다.')) {
      api('DELETE', '/bigfile/api/share/' + DF.id + '/' + encodeURIComponent(x.dataset.x)).then(function (r) { DF = r.file; drawLinks(); loadList(); }, function (er) { toast(er.message); });
    }
  };
  $('dMake').onclick = function () {
    api('POST', '/bigfile/api/share/' + DF.id + '?days=' + $('dDays').value + '&max=' + $('dMax').value).then(function (r) {
      DF = r.file; drawLinks(); loadList();
      var inp = $('dLinks').querySelector('.lk:last-child input'); if (inp) copy(inp.value, inp);
    }, function (er) { toast(er.message); });
  };
  $('dClose').onclick = function () { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); };

  //  시험용 — 점검 도구가 계산을 맞춰 본다
  window.__bigfile = { crc32: crc32, wholeCrc: wholeCrc };
  loadInfo().then(loadList).catch(function (e) { toast(e.message); });
})();
</script>
</body>
</html>
