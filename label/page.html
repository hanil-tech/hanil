<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한일 라벨 발행 · v{{VER}}</title>
<style>
:root{--ink:#1b2a4a;--acc:#2954A5;--acc2:#1f4488;--bg:#f4f6fa;--card:#fff;--line:#e3e8f0;--muted:#6b7684;--good:#1a7f4b;--bad:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:#222;font:17px/1.5 "Segoe UI","Malgun Gothic",sans-serif}
button,input,select{font:inherit}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;min-height:56px}
.top .brand{font-weight:800;color:var(--ink);font-size:20px;display:none;cursor:pointer}
.top .sp{flex:1}
.top a{color:var(--muted);text-decoration:none;font-size:15px;padding:6px 10px;border-radius:8px}
.top a:hover{background:#e9edf4;color:var(--ink)}
#eng{font-size:13px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:0 20px 40px}
/* ── 첫 화면: 가운데 검색 ── */
#hero{text-align:center;margin-top:16vh;transition:margin .2s}
#hero h1{margin:0;font-size:54px;letter-spacing:-1px;color:var(--ink)}
#hero h1 span{color:var(--acc)}
#hero p{margin:8px 0 26px;color:var(--muted);font-size:18px}
#sf{display:flex;max-width:760px;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:40px;
  padding:6px 6px 6px 26px;box-shadow:0 2px 10px rgba(20,30,60,.06);align-items:center}
#sf:focus-within{border-color:var(--acc);box-shadow:0 3px 16px rgba(41,84,165,.18)}
#q{flex:1;border:0;outline:0;font-size:26px;padding:10px 0;background:transparent;min-width:0}
#sf button{border:0;background:var(--acc);color:#fff;border-radius:30px;padding:14px 30px;font-size:20px;font-weight:700;cursor:pointer}
/* ── 치는 동안 아래에 미리보기(구글 추천처럼) ── */
#sbox{position:relative;max-width:760px;margin:0 auto}
#sug{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:0 10px 30px rgba(20,30,60,.16);overflow:hidden;z-index:5;text-align:left}
#sug.on{display:block}
.sg{display:flex;align-items:center;gap:14px;padding:8px 18px;cursor:pointer;border-bottom:1px solid #f0f2f6}
.sg:last-child{border-bottom:0}
.sg.hi,.sg:hover{background:#eef3fc}
.sg .th{width:104px;height:76px;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff center/contain no-repeat;
  display:flex;align-items:center;justify-content:center;color:#c2c9d6;font-size:20px}
.sg .pn{font-weight:800;color:var(--ink);font-size:19px}
.sg .pn mark{background:#fff1a8;color:inherit;border-radius:3px}
.sg .nm{font-size:15px}
.sg .cu{font-size:13px;color:var(--muted)}
.sg .gx{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sgmore{padding:8px 18px;font-size:14px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
/* 후보가 많으면 목록 안에서 막대로 내려 고른다(사용자 「막대를 내려서 선택할 수 있게」) — 손가락으로도 잡기 쉽게 굵게 */
#sgl{max-height:560px;overflow-y:auto;overscroll-behavior:contain}
/* ⚠ scrollbar-width·scrollbar-color 를 같이 적으면 Chromium(WebView2)이 아래 굵은 막대를 무시한다 — 적지 않는다 */
#sgl::-webkit-scrollbar{width:18px}
#sgl::-webkit-scrollbar-track{background:#eef1f6}
#sgl::-webkit-scrollbar-thumb{background:#9aa9c6;border-radius:9px;border:3px solid #eef1f6;min-height:48px}
#sgl::-webkit-scrollbar-thumb:hover{background:var(--acc)}
#tip{text-align:center;color:var(--muted);font-size:15px;margin-top:14px}
#tip b{color:var(--ink)}
body.found #hero{margin-top:0}
body.found #hero h1,body.found #hero p{display:none}
body.found .top .brand{display:block}
body.found #tip{display:none}
/* ── 찾은 것 ── */
#msg{max-width:760px;margin:14px auto 0;color:var(--muted);text-align:center}
#msg.bad{color:var(--bad)}
#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;
  transition:transform .08s,box-shadow .08s}
.it:hover,.it:focus{box-shadow:0 4px 18px rgba(20,30,60,.12);transform:translateY(-1px);outline:2px solid var(--acc)}
.it .ph{height:150px;background:#fff center/contain no-repeat;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#c2c9d6;font-size:40px}
.it .tx{padding:10px 14px 12px}
.it .pn{font-weight:800;font-size:19px;color:var(--ink);word-break:break-all}
.it .nm{font-size:15px;margin-top:2px}
.it .cu{font-size:13px;color:var(--muted);margin-top:4px}
/* ── 고른 것: 사진 + 수량 + 발행 ── */
#detail{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:20px;overflow:hidden}
body.pick #results{display:none}
body.pick #detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
#dimg{background:#fff center/contain no-repeat;min-height:420px;border-right:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;color:#c2c9d6;font-size:18px}
#dimg a{position:absolute;inset:0}
#dinfo{padding:26px 30px;display:flex;flex-direction:column;gap:14px}
#dpn{font-size:40px;font-weight:800;color:var(--ink);line-height:1.15;word-break:break-all}
#dnm{font-size:22px;margin-top:-6px}
#dcu{color:var(--muted);font-size:16px}
#dfrom{display:none;background:#eef3fc;color:var(--acc2);border-radius:10px;padding:8px 12px;font-size:15px}
.fl{display:flex;gap:12px;flex-wrap:wrap}
.fl>div{flex:1;min-width:120px}
.fl label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;font-weight:700}
.fl input,.fl select{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:20px}
.fl input:focus,.fl select:focus{border-color:var(--acc);outline:0}
#qty{font-size:40px!important;font-weight:800;text-align:right;padding:10px 16px!important}
#go{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:22px;font-size:28px;font-weight:800;cursor:pointer;margin-top:4px}
#go:hover{background:var(--acc2)}
#go:disabled{background:#9aa9c6;cursor:wait}
/* ── 양식별 프린터 — 인쇄하는 동안만 라벨만 보이게 ── */
#printArea{display:none}
#printer option[value=""]{color:var(--muted)}
@media print{
  body.hp{margin:0!important;padding:0!important;background:#fff!important}
  body.hp>*:not(#printArea){display:none!important}
  body.hp #printArea{display:block!important}
}
/* ── 파레트(여러 품번) ── */
#plist{display:none;max-height:none;overflow:visible;padding:14px;border-right:1px solid var(--line);background:#fff}
#plist table{width:100%;border-collapse:collapse;font-size:17px}
#plist th{text-align:left;color:var(--muted);font-size:13px;padding:6px 8px;border-bottom:2px solid var(--line)}
#plist td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
#plist td.pn{font-weight:800;word-break:break-all}
#plist td.nm{color:var(--muted);font-size:14px}
#plist input{width:110px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:20px;font-weight:700;text-align:right}
#plist input:focus{border-color:var(--acc);outline:0}
#pprev{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f9fafc}
#pprev .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);background:#fff}
#pvf{display:block;width:100%;height:320px;border:0;background:#fff}
#pvmsg{padding:40px 12px;text-align:center;color:var(--muted);font-size:15px}
body.pal #dimg,body.pal #qtyBox{display:none}
body.pal #plist{display:block}
#back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:17px;cursor:pointer;color:var(--ink)}
/* ── 처음으로 · 언어 ── */
.hb{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:8px 16px;font-size:17px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:6px}
.hb:hover{border-color:var(--acc);color:var(--acc)}
#homeBtn{font-size:18px}
#langs{display:none;text-align:center;margin-top:9vh}
#langs h1{font-size:44px;color:var(--ink);margin:0 0 6px}
#lgTitle{color:var(--muted);font-size:17px;max-width:900px;margin:0 auto 30px;line-height:1.7}
#lgGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:960px;margin:0 auto}
.lgb{border:2px solid var(--line);background:#fff;border-radius:18px;padding:22px 10px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:8px;font-size:24px;font-weight:700;color:var(--ink)}
.lgb .fl{font-size:54px;line-height:1}
.lgb:hover,.lgb:focus{border-color:var(--acc);box-shadow:0 4px 18px rgba(41,84,165,.18);outline:0}
#lgQuick{display:flex;justify-content:center;gap:8px;margin-top:22px}
.lgq{border:2px solid transparent;background:transparent;border-radius:10px;font-size:30px;padding:4px 6px;line-height:0;cursor:pointer;opacity:.55}
.lgq.on,.lgq:hover{opacity:1;border-color:var(--acc);background:#fff}
body.found #lgQuick{display:none}
body.lang #langs{display:block}
body.lang #hero,body.lang #sbox,body.lang #tip,body.lang #msg,body.lang #results,body.lang #detail,body.lang #lgQuick,body.lang .top .hb,body.lang .top a{display:none!important}
#ver{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:3px 10px;font-size:14px;font-weight:700;letter-spacing:.3px}
#lgVer{margin-top:28px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:16px 26px;border-radius:14px;
  font-size:19px;box-shadow:0 6px 30px rgba(0,0,0,.25);display:none;z-index:9;max-width:92vw;text-align:center}
#toast.ok{background:var(--good)}
#toast.bad{background:var(--bad)}
#engine{position:fixed;width:1200px;height:900px;left:-3000px;top:0;border:0;visibility:hidden}
@media (max-width:760px){
  body.pick #detail{grid-template-columns:1fr}
  #dimg{min-height:240px;border-right:0;border-bottom:1px solid var(--line)}
  #hero h1{font-size:38px}
}
</style></head>
<body>
<div class="top">
  <button class="hb" id="homeBtn" onclick="home()">🏠 <span data-t="home">처음으로</span></button>
  <div class="brand" onclick="home()">🏷 <span data-t="brand">한일 라벨</span></div>
  <span class="sp"></span>
  <span id="ver">v{{VER}}</span>
  <span id="eng">…</span>
  <button class="hb" id="langBtn" onclick="showLang()">🌐</button>
  <a href="/kiosk/label" data-t="detail">상세 화면</a>
</div>
<main>
  <div id="langs">
    <h1>🌐</h1>
    <div id="lgTitle"></div>
    <div id="lgGrid"></div>
    <div style="margin-top:18px"><button id="lgMore" class="hb" style="display:none;margin:0 auto" onclick="ALL_LANGS=true;drawLangs();applyLang()">🌐 +</button></div>
    <div id="lgVer"><span id="ver2" style="display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:4px 12px;font-size:15px;font-weight:700">🏷 v{{VER}}</span></div>
  </div>
  <div id="hero">
    <h1>🏷 <span data-t="brand">한일 라벨</span></h1>
    <p data-t="sub">품번·품명을 찾거나, 옆에 둔 라벨을 리더기로 찍으세요</p>
  </div>
  <div id="sbox">
    <form id="sf" onsubmit="event.preventDefault();submitQ()">
      <input id="q" autocomplete="off" spellcheck="false" data-tp="ph" autofocus>
      <button type="submit" data-t="find">찾기</button>
    </form>
    <div id="sug"></div>
  </div>
  <div id="tip">📷 <span data-t="tip"></span></div>
  <div id="lgQuick"></div>
  <div id="msg"></div>
  <div id="results"></div>
  <div id="detail">
    <div id="dimg"></div>
    <div id="plist"></div>
    <div id="dinfo">
      <div id="dfrom"></div>
      <div id="dpn"></div>
      <div id="dnm"></div>
      <div id="dcu"></div>
      <div class="fl">
        <div id="qtyBox" style="flex:2"><label data-t="qty"></label><input id="qty" inputmode="numeric" autocomplete="off"></div>
        <div><label data-t="cnt"></label><input id="cnt" type="number" min="1" value="1" style="text-align:right"></div>
      </div>
      <div class="fl">
        <div><label data-t="paper"></label><select id="paper"></select></div>
        <div><label data-t="form"></label><select id="form"></select></div>
        <div id="prBox" style="display:none"><label data-t="printer"></label><select id="printer"></select></div>
      </div>
      <button id="go" onclick="issue()">🏷 <span data-t="issue"></span></button>
      <button id="back" onclick="backToList()">← <span data-t="back"></span></button>
    </div>
  </div>
</main>
<div id="toast"></div>

var LG=(function(){ try{ return localStorage.getItem('hl_lang')||'ko'; }catch(e){ return 'ko'; } }());

//    한국어는 늘 맨 앞, 나머지는 인원 많은 순, 영어는 모르는 나라를 위해 늘 끝에.
//  ⚠ 포털에 그 길이 없거나(아직 안 고친 포털) 못 받으면 **모든 말**을 보인다 — 못 고르는 것보다 낫다.
var NAT_RE=[[/한국|대한민국|korea|내국인|^kr$/i,'ko'],[/베트남|viet|^vn$/i,'vi'],[/미얀마|버마|myanmar|burm|^mm$/i,'my'],
  [/태국|thai|^th$/i,'th'],[/우즈베|우즈벡|uzbek|^uz$/i,'uz'],[/키르기스|kyrgy|러시아|russia|카자흐|kazakh/i,'ru'],
  [/중국|china|chinese|^cn$|조선족/i,'zh'],[/네팔|nepal|^np$/i,'ne'],[/캄보디아|cambod|khmer|^kh$/i,'km'],
  [/인도네시아|indones|^id$/i,'id'],[/스리랑카|lanka|^lk$/i,'si'],[/필리핀|philip|^ph$/i,'en']];
function natLang(n){ n=String(n||'').trim(); if(!n) return 'ko'; for(var i=0;i<NAT_RE.length;i++) if(NAT_RE[i][0].test(n)) return NAT_RE[i][1]; return 'en'; }

var ALL_LANGS=false;
function shownLangs(){
  if(ALL_LANGS || !STAFF || !Object.keys(STAFF).length) return LANG_LIST;
  var codes=Object.keys(STAFF).filter(function(c){ return c!=='ko' && c!=='en'; })
    .sort(function(a,b){ return STAFF[b]-STAFF[a]; });
  codes=['ko'].concat(codes).concat(['en']);
  return codes.map(function(c){ return LANG_LIST.filter(function(x){ return x[0]===c; })[0]; }).filter(Boolean);
}
async function loadStaffLangs(){
  try{
    var r=await fetch('/api/labels/staff-langs',{cache:'no-store'});

    var d=await r.json();
    var m={};
    (d.nats||[]).forEach(function(x){ var l=natLang(x.nat); m[l]=(m[l]||0)+(Number(x.n)||0); });
    if(!Object.keys(m).length) return;

}

  if(engReady()){ $('eng').textContent='● '+t('ready'); $('eng').style.color='var(--good)'; fillSel(); return; }

  var w=W(); if(!w) return;
  var sh=w.SHEETS||[], fo=w.document.getElementById('form');
  var ps=$('paper'), fs=$('form'), pv=ps.value, fv=fs.value;

  fs.innerHTML=[].map.call(fo.options,function(o){ return '<option value="'+esc(o.value)+'">'+esc(o.textContent)+'</option>'; }).join('');

    'ㄹ':'f','ㅎ':'g','ㅗ':'h','ㅓ':'j','ㅏ':'k','ㅣ':'l','ㅋ':'z','ㅌ':'x','ㅊ':'c','ㅍ':'v','ㅠ':'b','ㅜ':'n','ㅡ':'m',
    'ㅃ':'Q','ㅉ':'W','ㄸ':'E','ㄲ':'R','ㅆ':'T','ㅒ':'O','ㅖ':'P',
    'ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅢ':'ml',
    'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'};
  function one(ch){
    var c=ch.charCodeAt(0);
    if(c>=0xAC00 && c<=0xD7A3){ var i=c-0xAC00; return (key[cho[Math.floor(i/588)]]||'')+(key[jung[Math.floor(i%588/28)]]||'')+(key[jong[i%28]]||''); }
    return key[ch]!=null ? key[ch] : ch;
  }
  return function(s){ return String(s).split('').map(one).join('').toUpperCase(); };
}());
function hasKo(s){ return /[ㄱ-ㆎ가-힣]/.test(s); }
//  라벨 QR 읽기 — HANIL|품번|수량|날짜|로트|고유번호  ·  HANIL-PVL|전표|id|품번|수량|고유번호  ·  HANIL-PL|파레트  ·  HANIL-SMP|견본번호
function parseQR(s){
  var t=String(s||'').trim();
  if(t.indexOf('|')<0) return null;
  if(hasKo(t)) t=KO(t);
  var f=t.split('|'), h=f[0].toUpperCase();
  if(h==='HANIL') return {pn:f[1]||'', qty:f[2]||'', serial:f[5]||''};
  if(h==='HANIL-PVL') return {pn:f[3]||'', qty:f[4]||'', serial:f[5]||''};
  if(h==='HANIL-PL') return {bundle:f[1]||''};
  if(h==='HANIL-SMP') return {smp:f[1]||''};          //  🏷 견본(샘플) 라벨 — 포털 「견본」에서 만든 것
  return {unknown:t};
}

//  ── 찾기 ─────────────────────────────────────────────────
function say(t, bad){ var m=$('msg'); m.textContent=t||''; m.className=bad?'bad':''; }
async function search(raw){
  raw=String(raw||'').trim();
  if(!raw) return;
  hideSug();
  var qr=parseQR(raw);
  if(qr){
    $('q').value='';
    if(qr.bundle) return openFromPallet(qr.bundle);
    if(qr.smp) return openFromSample(qr.smp);
    if(qr.unknown || !qr.pn){ say(t('notlabel')+': '+(qr.unknown||raw), true); return; }
    return openFromQR(qr);
  }
  document.body.classList.add('found'); document.body.classList.remove('pick');
  say(t('searching')); $('results').innerHTML='';
  try{
    var d=await api('/api/labels/find?src=item&q='+encodeURIComponent(raw));
    var rows=d.rows||[];
    //  ⚠ 한글 상태에서 찍힌 품번 바코드 — 못 찾으면 영문 자판으로 되돌려 한 번 더 본다
    if(!rows.length && hasKo(raw)){
      var alt=KO(raw);
      var d2=await api('/api/labels/find?src=item&q='+encodeURIComponent(alt));
      if((d2.rows||[]).length){ rows=d2.rows; raw=alt; $('q').value=alt; }
    }
    ROWS=rows;
    var exact=rows.filter(function(r){ return String(r.part_no||'').toUpperCase()===raw.toUpperCase(); });
    if(exact.length===1) return pick(exact[0]);
    if(rows.length===1) return pick(rows[0]);
    if(!rows.length){ say('「'+raw+'」 — '+t('none'), true); return; }
    say(rows.length>=200 ? t('many') : t('found', rows.length));
    $('results').innerHTML=rows.map(function(r,i){
      var img=Number(r.img_id)||0;
      return '<button class="it" onclick="pick(ROWS['+i+'])">'
        +'<div class="ph"'+(img?' style="background-image:url(/api/items/img/'+img+')"':'')+'>'+(img?'':'🏷')+'</div>'
        +'<div class="tx"><div class="pn">'+esc(r.part_no)+'</div><div class="nm">'+esc(r.part_name||'')+'</div>'
        +'<div class="cu">'+esc([r.customer,r.model].filter(Boolean).join(' · '))+'</div></div></button>';
    }).join('');
  }catch(e){ say(e.message, true); }
}
async function openFromQR(qr){
  document.body.classList.add('found');
  say(t('readqr')+' — '+qr.pn);
  try{
    var d=await api('/api/labels/find?src=item&q='+encodeURIComponent(qr.pn));
    var row=(d.rows||[]).filter(function(r){ return String(r.part_no||'').toUpperCase()===qr.pn.toUpperCase(); })[0];
    //  🆔 고유번호가 있으면 그 라벨에 찍혔던 거래처를 그대로 쓴다
    var sv=null;
    if(qr.serial){ try{ var s=await api('/api/labels/serial/'+encodeURIComponent(qr.serial)); if(s.found) sv=s; }catch(e){} }
    if(!row && qr.row) row={part_no:qr.row.part_no, part_name:qr.row.part_name||'', customer:qr.row.customer||'', model:qr.row.model||'', img_id:0};
    if(!row){
      if(!sv){ say(t('nopart')+': '+qr.pn, true); return; }
      row={part_no:sv.part_no, part_name:sv.part_name, customer:sv.customer, model:'', img_id:0};
    }
    row=Object.assign({}, row);
    if(sv && sv.customer) row.customer=sv.customer;
    pick(row, {qty:qr.qty, serial:qr.serial, smp:qr.smp, form:qr.form, sheet:qr.sheet});
  }catch(e){ say(e.message, true); }
}
//  📦 파레트 라벨을 샘플로 — QR 에는 파레트 번호(P00011)만 있다. 포털에 그 파레트에 담긴 품번·수량을 물어
//   같은 묶음으로 **새 파레트 라벨**을 뽑는다(새 파레트 번호·새 로트 — 포털이 매긴다).
//   GET /api/labels/pallet/P00011 → {ok, pallet:{no, form, sheet, copies, items:[{part_no, part_name, customer, model, spec, unit, qty, img_id}]}}
//   ⚠ 포털에 이 주소가 아직 없으면(404) 예전처럼 「상세 화면」 안내만 한다.
async function openFromPallet(no){
  no=String(no||'').trim().toUpperCase();
  document.body.classList.add('found');
  say('📦 '+t('readqr')+' — '+no);
  var d;
  try{
    var r=await fetch('/api/labels/pallet/'+encodeURIComponent(no),{cache:'no-store'});
    if(r.status===401){ location.href='/?next=/label'; return; }
    try{ d=await r.json(); }catch(e){ d=null; }
    //  ⚠ 404 인데 포털이 «파레트 창구»의 답(code)을 주지 않았다 = 포털에 이 주소가 아직 없다 → 예전 안내
    if(r.status===404 && !(d && d.code)){ say('📦 '+no+' — '+t('bundle'), true); return; }
    if(!r.ok || !d || d.ok===false){ say('📦 '+no+' — '+((d&&d.error)||t('bundle')), true); return; }
  }catch(e){ say('📦 '+no+' — '+e.message, true); return; }
  var pl=d.pallet||d.row||{};
  var items=(pl.items||d.items||[]).filter(function(x){ return x && x.part_no; });
  if(!items.length){ say('📦 '+no+' — '+t('palNone'), true); return; }
  pickPallet(no, pl, items);
}
function pickPallet(no, pl, items){

    }).join('')+'</table>'
    +'<div id="pprev"><div class="hd"><span>👁 '+esc(t('pv'))+'</span><span>'+esc(t('pvNote'))+'</span></div>'
    +'<div id="pvmsg">'+esc(t('pvWait'))+'</div>'
    //  ⚠ sandbox(스크립트·인쇄 창 없음) — 라벨 HTML 에 저절로 인쇄하는 코드가 있어도 여기서는 안 돈다
    +'<iframe id="pvf" sandbox="allow-same-origin" style="display:none" tabindex="-1"></iframe></div>';
  fillSel();

  if(pref){ if(pref.paper) $('paper').value=pref.paper; if(pref.form) $('form').value=pref.form; }

    e.addEventListener('keydown', function(ev){
      if(ev.key!=='Enter') return;
      ev.preventDefault();
      if(/[|A-Za-zㄱ-힣]/.test(this.value)){ var v=this.value; this.value=''; search(v); return; }
      var L=$('plist').querySelectorAll('.pq'), i=Number(this.getAttribute('data-i'));
      if(i+1<L.length){ L[i+1].focus(); L[i+1].select(); } else issue();

//  엔진(포털 라벨 화면)의 칸에 값을 넣고, 화면이 알아채도록 change 를 보낸다
function engSet(el, v){
  if(!el) return;
  if(el.type==='checkbox'){ if(el.checked===!!v) return; el.checked=!!v; }
  else { if(el.value===String(v)) return; el.value=v; }
  try{ el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
}
//  「몇 장 (한 라벨로 묶을 때)」 칸 — 이름(id)을 모르니 글자로 찾는다
function engCopies(doc){
  var L=doc.querySelectorAll('label,span,div,td,th');
  for(var i=0;i<L.length;i++){
    var e=L[i]; if(e.children.length>3) continue;
    if(/몇\s*장/.test(e.textContent||'') && /묶/.test(e.textContent||'')){
      var inp=e.querySelector('input') || (e.htmlFor && doc.getElementById(e.htmlFor));
      for(var n=e.nextElementSibling; !inp && n; n=n.nextElementSibling){ inp=(n.tagName==='INPUT')?n:n.querySelector('input'); }
      if(!inp && e.parentElement) inp=e.parentElement.querySelector('input');
      if(inp) return inp;
    }
  }
  return null;
}
//  🏷 견본(샘플) 라벨 — QR 에는 견본번호(S0003)만 있다. 포털에 물어 그 품번·기본 수량·양식·라벨지로 연다.
//   GET /api/labels/sample/S0003 → {ok, row:{part_no, part_name, customer, model, unit, qty_def, form, sheet, per_box, code}}
//   ⚠ 내려 둔 견본은 410 + «이 종이는 떼어 주세요» 글 → 그대로 빨갛게 보인다. 없는 번호는 404.
//   ⚠ 견본은 제품 라벨이 아니다 — 여기서 뽑는 것은 늘 새 로트·새 고유번호의 진짜 라벨이다.
async function openFromSample(code){
  code=String(code||'').trim().toUpperCase();
  document.body.classList.add('found');
  say('🏷 '+t('readqr')+' — '+code);
  var d;
  try{ d=await api('/api/labels/sample/'+encodeURIComponent(code)); }

//  ── 치는 동안 아래에 미리보기 ─────────────────────────────
//  ⭐ 두세 글자만 쳐도 사진과 함께 후보가 뜬다 — 끝까지 치고 Enter 를 누르지 않아도 고를 수 있다.
//  ⚠ 리더기(QR)는 `|` 가 섞여 들어오므로 미리보기를 띄우지 않는다(Enter 가 곧 온다).
var SUG=[], SUGI=-1, sugT=null, sugSeq=0;
function hideSug(){ $('sug').className=''; $('sug').innerHTML=''; SUG=[]; SUGI=-1; clearTimeout(sugT); sugSeq++; }
function mark(t, q){
  t=String(t||''); var i=t.toUpperCase().indexOf(q.toUpperCase());
  if(!q || i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
async function suggest(){
  var q=$('q').value.trim(), my=++sugSeq;
  if(q.length<2 || q.indexOf('|')>=0){ hideSug(); return; }
  try{
    var d=await api('/api/labels/find?src=item&q='+encodeURIComponent(q));
    if(my!==sugSeq) return;                 //  ⚠ 그 사이 더 쳤으면 옛 답은 버린다
    var rows=d.rows||[];
    if(!rows.length && hasKo(q)){ var alt=KO(q); var d2=await api('/api/labels/find?src=item&q='+encodeURIComponent(alt));
      if(my!==sugSeq) return; rows=d2.rows||[]; q=alt; }
    SUG=rows.slice(0,100); SUGI=-1;            //  ⭐ 8개만이 아니라 100개까지 — 넘치면 목록 안에서 막대로 내린다
    if(!SUG.length){ $('sug').innerHTML='<div class="sgmore">「'+esc(q)+'」 — '+t('none')+'</div>'; $('sug').className='on'; return; }
    $('sug').innerHTML='<div id="sgl">'+SUG.map(function(r,i){
      var img=Number(r.img_id)||0;
      return '<div class="sg" data-i="'+i+'" onmousedown="event.preventDefault();pickSug('+i+')">'
        +'<div class="th"'+(img?' style="background-image:url(/api/items/img/'+img+')"':'')+'>'+(img?'':'🏷')+'</div>'
        +'<div class="gx"><div class="pn">'+mark(r.part_no,q)+'</div>'
        +'<div class="nm">'+mark(r.part_name||'',q)+'</div>'
        +'<div class="cu">'+esc([r.customer,r.model].filter(Boolean).join(' · '))+'</div></div></div>';
    }).join('')+'</div>'+(rows.length>SUG.length?'<div class="sgmore">'+esc(t('more', rows.length-SUG.length))+'</div>':'');
    $('sug').className='on';
    //  목록 끝이 화면 밖으로 나가지 않게 — 남은 높이만큼만(막대로 내린다)
    var gl=$('sgl'); if(gl){ var ex=$('sug').querySelector('.sgmore'); gl.style.maxHeight=Math.max(240, Math.min(560, innerHeight-gl.getBoundingClientRect().top-(ex?ex.offsetHeight:0)-16))+'px'; }
  }catch(e){ hideSug(); }
}
function hiSug(k){
  var L=$('sug').querySelectorAll('.sg'); if(!L.length) return;
  var m=L.length+1; SUGI=((SUGI+1+k)%m+m)%m-1;      //  -1 = 검색창으로 돌아옴
  [].forEach.call(L,function(e,i){ e.className='sg'+(i===SUGI?' hi':''); });
  if(SUGI>=0) L[SUGI].scrollIntoView({block:'nearest'});
}
function pickSug(i){ var r=SUG[i]; hideSug(); if(r){ $('q').value=r.part_no||''; pick(r); } }
function submitQ(){

}
$('q').addEventListener('input', function(){ clearTimeout(sugT); sugT=setTimeout(suggest, 220); });

});
//  ⚠ 막대를 잡거나 손가락으로 목록을 밀면 검색창의 포커스가 빠진다 → 그때는 목록을 닫지 않고, 놓으면 검색창으로 돌려준다

//  ── 고르기 → 수량 → 발행 ─────────────────────────────────

var busy=false;
async function issue(){

  var n=Math.max(1, Math.min(200, Math.floor(Number($('cnt').value)||1)));
  var w=W();
  if(!w || !engReady()){ toast(t('notready'), 'bad'); return; }
  busy=true; $('go').disabled=true; $('go').textContent=t('making');
  try{
    var doc=w.document;
    //  라벨지·양식 — 사무실에서 맞춰 둔 모양(여백·글자·QR)은 라벨 화면이 양식별로 불러온다

    if($('form').value && fo.value!==$('form').value){
      fo.value=$('form').value;
      try{ w.formChanged(); }catch(e){}
      try{ w.loadOrient(); }catch(e){}
      try{ w.loadTune(); }catch(e){}
    }
    if($('paper').value) sh.value=$('paper').value;
    engSet(doc.getElementById('bundleChk'), false);
    engSet(doc.getElementById('perBox'), '');
    w.CART=[{img_id:CUR.img_id||0, customer:CUR.customer||'', part_no:CUR.part_no||'', part_name:CUR.part_name||'',
      model:CUR.model||'', spec:CUR.spec||'', due:'', qty:qty, unit:'EA', n:n}];
    w.__lastHtml='';
    await w.preview();
    if(!w.__lastHtml) throw new Error(t('makefail'));
    var usedPr=await doPrint(w);
    var info=(doc.getElementById('msg')||{}).textContent||'';
    var lot=(info.match(/로트\s+([0-9A-Za-z\-·\s]+)/)||[])[1]||'';
    //  다음에 같은 품번을 찍으면 같은 라벨지·양식으로
    var pref={paper:$('paper').value, form:$('form').value};
    store('hl_pn:'+String(CUR.part_no||'').toUpperCase(), pref); store('hl_last', pref);
    toast('🖨 '+t('printed')+' — '+CUR.part_no+' · '+t('qtyS')+' '+Number(qty).toLocaleString('ko-KR')+' · '+t('cntS')+' '+n+(lot?(' · '+t('lotS')+' '+lot.trim()):'')+(usedPr?(' · 🖨 '+usedPr):''), 'ok');
    setTimeout(home, 1200);
  }catch(e){
    toast('⚠ '+e.message, 'bad');
  }finally{
    busy=false; $('go').disabled=false; $('go').innerHTML='🏷 '+esc(t('issue'));
  }
}

//  📦 파레트 — 담긴 품번을 모두 장바구니에 넣고 「로 묶기 (한 파레트)」를 켜서 한 라벨로
function palCart(){
  var L=$('plist').querySelectorAll('.pq'), cart=[];
  for(var i=0;i<L.length;i++){
    var x=CUR.items[i], q=String(L[i].value||'').replace(/[^0-9.]/g,'');
    if(!q || !(Number(q)>0)) return {bad:i, part:x.part_no};
    cart.push({img_id:x.img_id||0, customer:x.customer||'', part_no:x.part_no||'', part_name:x.part_name||'',
      model:x.model||'', spec:x.spec||'', due:'', qty:q, unit:x.unit||'EA', n:1});
  }
  return {cart:cart};
}
//  숨은 라벨 화면에 양식·라벨지·장바구니·묶기·장수를 넣는다 → 넣은 장수를 돌려준다
function engFillPallet(w, cart, n){
  var doc=w.document, bc=doc.getElementById('bundleChk');
  var fo=doc.getElementById('form'), sh=doc.getElementById('sheet');
  if($('form').value && fo.value!==$('form').value){
    fo.value=$('form').value;
    try{ w.formChanged(); }catch(e){}
    try{ w.loadOrient(); }catch(e){}
    try{ w.loadTune(); }catch(e){}
  }
  if($('paper').value) sh.value=$('paper').value;
  engSet(doc.getElementById('perBox'), '');
  w.CART=cart;
  engSet(bc, true);
  w.CART=cart;                     //  ⚠ 묶기를 켜는 순간 화면이 장바구니를 다시 그릴 수 있다 — 한 번 더
  var cp=engCopies(doc);
  if(cp) engSet(cp, n); else n=1;  //  ⚠ 장수 칸을 못 찾으면 한 장만(품번 줄의 n 을 늘리면 그 품번만 여러 번 찍힌다)
  return n;
}
//  ⚠ 엔진은 한 번에 하나만 — 미리보기와 발행이 겹치지 않게 줄을 세운다
var engQ=Promise.resolve();
function engRun(fn){ var p=engQ.then(fn, fn); engQ=p.catch(function(){}); return p; }

//  👁 미리보기 — 라벨 화면의 preview() 는 /api/labels/make 로 **번호·로트를 매긴다**.
//   그래서 미리보기 동안에는 그 요청을 /api/labels/make-preview(저장 안 함)로 돌린다.
//   ⚠ 포털에 그 주소가 없으면 404 → 미리보기만 안 보인다. 번호는 하나도 쓰지 않는다(진짜 make 로 새지 않게 막는다).
function dryOn(w){
  var st={hit:0, status:0, bad:0};
  var of=w.fetch, XP=w.XMLHttpRequest && w.XMLHttpRequest.prototype, ox=XP && XP.open, oa=w.alert, oc=w.confirm;
  var MK=/\/api\/labels\/make(?=[?#]|$)/;
  w.fetch=function(u, o){
    var s=(typeof u==='string') ? u : (u && u.url) || '';
    if(MK.test(s.split('?')[0]) || MK.test(s)){
      st.hit++;
      if(typeof u!=='string'){ st.bad++; return Promise.reject(new Error('preview')); }
      return of.call(w, s.replace('/api/labels/make', '/api/labels/make-preview'), o).then(function(r){ st.status=r.status; return r; });
    }
    return of.apply(w, arguments);
  };
  if(XP) XP.open=function(m, u){
    var a=[].slice.call(arguments);
    if(MK.test(String(u||''))){ st.hit++; a[1]=String(u).replace('/api/labels/make', '/api/labels/make-preview'); }
    return ox.apply(this, a);
  };
  w.alert=function(){}; w.confirm=function(){ return false; };
  return {st:st, off:function(){ w.fetch=of; if(XP) XP.open=ox; w.alert=oa; w.confirm=oc; }};
}
var pvT=null, pvSeq=0;
function pvSoon(ms){ clearTimeout(pvT); pvT=setTimeout(pvDraw, ms==null?500:ms); }
function pvShow(msg){
  var m=$('pvmsg'), f=$('pvf'); if(!m) return;
  if(msg!=null){ m.textContent=msg; m.style.display='block'; f.style.display='none'; }
  else { m.style.display='none'; f.style.display='block'; }
}
function pvDraw(){
  if(!CUR || !CUR.pallet || !$('pvf')) return;
  var my=++pvSeq, pc=palCart();
  if(!pc.cart){ pvShow(t('pvQty')); return; }
  var w=W();
  if(!w || !engReady()){ pvShow(t('notready')); pvSoon(1500); return; }
  if(!w.document.getElementById('bundleChk')){ pvShow(t('palNoBundle')); return; }
  pvShow(t('pvWait'));
  var n=Math.max(1, Math.min(200, Math.floor(Number($('cnt').value)||1)));
  return engRun(async function(){
    if(my!==pvSeq || !CUR || !CUR.pallet) return;
    var dry=dryOn(w), html='';
    try{
      engFillPallet(w, pc.cart, n);
      w.__lastHtml='';
      try{ await w.preview(); }catch(e){}
      html=w.__lastHtml||'';
    }finally{
      dry.off();
      try{ engSet(w.document.getElementById('bundleChk'), false); }catch(e){}
      w.__lastHtml='';
    }
    if(my!==pvSeq) return;
    if(dry.st.hit && dry.st.status===404){ pvShow(t('pvNone')); return; }
    if(!html){ pvShow(t('pvFail')); return; }
    pvPaint(html);
  });
}
//  라벨 HTML 을 칸 너비에 맞춰 줄여 보인다
function pvPaint(html){
  var f=$('pvf'); if(!f) return;
  pvShow(null);
  f.onload=function(){
    try{
      var d=f.contentDocument, b=d && d.body; if(!b) return;
      d.documentElement.style.background='#fff';
      var W0=Math.max(b.scrollWidth, d.documentElement.scrollWidth, 1);
      var z=Math.min(1, (f.clientWidth-8)/W0);
      b.style.zoom=z;
      var H=Math.max(b.scrollHeight, d.documentElement.scrollHeight);
      f.style.height=Math.min(900, Math.max(160, Math.ceil(H*z)+8))+'px';
    }catch(e){}
  };
  f.srcdoc=html;
}
async function issuePallet(){
  var pc=palCart();
  if(!pc.cart){ toast(t('needqty')+' — '+pc.part, 'bad'); var L=$('plist').querySelectorAll('.pq'); L[pc.bad].focus(); return; }
  var cart=pc.cart;
  var n=Math.max(1, Math.min(200, Math.floor(Number($('cnt').value)||1)));
  var w=W();
  if(!w || !engReady()){ toast(t('notready'), 'bad'); return; }
  var doc=w.document, bc=doc.getElementById('bundleChk');
  if(!bc){ toast(t('palNoBundle'), 'bad'); return; }
  busy=true; $('go').disabled=true; $('go').textContent=t('making');
  clearTimeout(pvT); pvSeq++;                       //  그리던 미리보기는 버린다
  var usedPr='';
  try{
    await engRun(async function(){
      try{
        n=engFillPallet(w, cart, n);
        w.__lastHtml='';
        await w.preview();
        if(!w.__lastHtml) throw new Error(t('makefail'));
        usedPr=await doPrint(w);
      }finally{ try{ engSet(bc, false); }catch(e){} }
    });
    var pref={paper:$('paper').value, form:$('form').value};
    store('hl_pl:'+CUR.pallet, pref); store('hl_last', pref);
    toast('🖨 '+t('printed')+' — 📦 '+CUR.pallet+' · '+t('palItems', cart.length)+' · '+t('cntS')+' '+n+(usedPr?(' · 🖨 '+usedPr):''), 'ok');
    setTimeout(home, 1200);
  }catch(e){
    toast('⚠ '+e.message, 'bad');
  }finally{
    busy=false; $('go').disabled=false; $('go').innerHTML='🏷 '+esc(t('issue'));
  }
}

//  ── 🖨 양식별 프린터 ─────────────────────────────────────
//   사용자 「양식별로 프린터를 지정할 수 있게」
//   ⭐ 프로그램(독자 창)이 프린터 목록과 «양식 → 프린터»를 이 PC 에 들고 있다(printers.json).
//     정해 둔 양식은 인쇄 창 없이 그 프린터로 바로, 안 정한 양식은 예전 그대로.
//   ⚠ Edge 창으로 뜬 옛 PC(WebView2 없음)에는 hanilPrinters 가 없다 → 프린터 칸을 감춘다.
var PRN=null;
async function prLoad(){
  if(typeof window.hanilPrinters!=='function') return;
  try{ PRN=await window.hanilPrinters(); }catch(e){ PRN=null; }
  if(!PRN) return;
  PRN.map=PRN.map||{}; PRN.printers=PRN.printers||[];
  var sel=$('printer');
  sel.innerHTML='<option value="">'+esc(PRN.mode==='silent' ? t('prDefault')+(PRN.default?(' ('+PRN.default+')'):'') : t('prDialog'))+'</option>'
    +PRN.printers.map(function(n){ return '<option value="'+esc(n)+'">🖨 '+esc(n)+(n===PRN.default?' ★':'')+'</option>'; }).join('');
  $('prBox').style.display='';
  prSync();
}
function printerFor(form){ return (PRN && PRN.map && form) ? (PRN.map[form]||'') : ''; }
function prSync(){
  if(!PRN) return;
  var v=printerFor($('form').value), sel=$('printer');
  //  ⚠ 정해 둔 프린터가 이 PC 에서 없어졌으면(이름 바뀜·빠짐) 목록에 «없음» 으로라도 보인다
  if(v && ![].some.call(sel.options, function(o){ return o.value===v; })){
    var o=document.createElement('option'); o.value=v; o.textContent='⚠ '+v; sel.appendChild(o);
  }
  sel.value=v;
}
$('form').addEventListener('change', prSync);
$('printer').addEventListener('change', async function(){
  var f=$('form').value, v=this.value; if(!PRN || !f) return;
  if(v) PRN.map[f]=v; else delete PRN.map[f];
  try{ await window.hanilSetPrinter(f, v); if(v) toast('🖨 '+($('form').selectedOptions[0]||{}).textContent+' → '+v+' — '+t('prSaved'), 'ok'); }
  catch(e){ toast('⚠ '+(e&&e.message||e), 'bad'); }
});
//  라벨 HTML 을 이 창 문서 안(#printArea)에 옮겨 놓고, 프로그램에 «이 프린터로» 를 부탁한다.
//   (PrintAsync 는 창의 문서를 찍는다 — 인쇄 때만 라벨 말고 다른 것은 모두 숨긴다)
function nativePrint(html, printer){
  return new Promise(function(resolve, reject){
    var area=$('printArea');
    if(!area){ area=document.createElement('div'); area.id='printArea'; document.body.appendChild(area); }
    var d=new DOMParser().parseFromString(html, 'text/html');
    var css=[].map.call(d.querySelectorAll('style'), function(e){ return '<style>'+e.textContent+'</style>'; }).join('')
      +[].map.call(d.querySelectorAll('link[rel="stylesheet"]'), function(e){ return '<link rel="stylesheet" href="'+esc(e.getAttribute('href')||'')+'">'; }).join('');
    var scripts=[].slice.call(d.querySelectorAll('script'));
    scripts.forEach(function(e){ e.parentNode.removeChild(e); });
    d.querySelectorAll('style,link[rel="stylesheet"]').forEach(function(e){ e.parentNode.removeChild(e); });
    area.innerHTML=css+d.body.innerHTML;
    //  라벨 안의 스크립트(QR 그리기 등)는 돌리되, 저절로 인쇄 창을 여는 것은 막는다
    var op=window.print, oo=window.onload; window.print=function(){};
    try{
      scripts.forEach(function(e){ var n=document.createElement('script'); if(e.src) n.src=e.src; else n.textContent=e.textContent; area.appendChild(n); });
      if(window.onload!==oo && typeof window.onload==='function'){ try{ window.onload(); }catch(e){} }
    }finally{ window.print=op; window.onload=oo; }
    var done=false;
    function clean(){ document.body.classList.remove('hp'); area.innerHTML=''; window.__hpDone=null; }
    window.__hpDone=function(hr, st){
      if(done) return; done=true; clean();
      if(hr===0 && st===0) resolve(); else reject(new Error(st===1 ? 'printer unavailable' : ('error '+hr+'/'+st)));
    };
    //  그림(QR·로고)이 다 들어온 뒤에 찍는다
    var imgs=[].slice.call(area.querySelectorAll('img')).filter(function(i){ return !i.complete; });
    Promise.all(imgs.map(function(i){ return new Promise(function(r){ i.onload=i.onerror=r; setTimeout(r, 4000); }); }))
      .then(function(){ return new Promise(function(r){ setTimeout(r, 120); }); })
      .then(function(){
        document.body.classList.add('hp');
        return window.hanilPrint(printer);
      })
      .then(function(){ setTimeout(function(){ if(!done){ done=true; clean(); resolve(); } }, 90000); })
      .catch(function(e){ if(!done){ done=true; clean(); reject(e instanceof Error ? e : new Error(String(e))); } });
  });
}
//  발행 — 정해 둔 프린터가 있으면 그리로, 없거나 실패하면 예전처럼(라벨 화면의 printHere)
//   ⚠ 실패해서 인쇄 창으로 물러설 때는 아직 한 장도 안 나간 때뿐이다(인쇄 시작 전 실패·프린터 없음).
async function doPrint(w){
  var pr=printerFor($('form').value);
  if(pr && typeof window.hanilPrint==='function'){
    try{ await nativePrint(w.__lastHtml, pr); return pr; }
    catch(e){ toast('⚠ 🖨 '+pr+' — '+t('prFallback')+' ('+(e&&e.message||e)+')', 'bad'); }
  }
  w.printHere();
  return '';
}

//  ── 키보드 ───────────────────────────────────────────────
$('qty').addEventListener('keydown', function(e){
  if(e.key!=='Enter') return;
  e.preventDefault();
  //  ⚠ 수량 칸에 있을 때 다른 라벨을 찍으면 QR 글자가 여기로 들어온다 → 새로 찾는다
  var v=this.value;
  if(/[|A-Za-zㄱ-힣]/.test(v)){ this.value=''; search(v); return; }
  issue();
});
$('cnt').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); issue(); } });
['cnt','paper','form'].forEach(function(id){ $(id).addEventListener(id==='cnt'?'input':'change', function(){ if(CUR && CUR.pallet) pvSoon(); }); });
document.addEventListener('keydown', function(e){
  if(document.body.classList.contains('lang')){
    //  ⚠ 언어 화면에서 리더기로 찍으면 지난번 언어로 곧장 찾기 화면으로(찍은 글자를 잃지 않게)
    if(e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){ document.body.classList.remove('lang'); home(); }
    return;
  }
  if(e.key==='Escape'){ if(document.body.classList.contains('pick')) backToList(); else home(); return; }
  //  아무 칸에도 없을 때 들어온 글자(리더기)는 찾기 칸으로
  var a=document.activeElement, tag=a&&a.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if(e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){ $('q').focus(); }
});

api('/api/labels/forms').catch(function(){});
drawLangs(); applyLang(); showLang(); idleReset(); loadStaffLangs(); prLoad();

try{ fetch('/__label/alive',{cache:'no-store'}); }catch(e){}
engWatch();
