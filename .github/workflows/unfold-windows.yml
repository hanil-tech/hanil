# 판금 전개 프로그램(unfold/)을 Windows 에서 시험하고 설치 파일을 만든다.
# 결과: Actions 실행 화면 아래 Artifacts 의 "HanilUnfold-Setup" (설치 파일)
name: 판금 전개 Windows 빌드

on:
  push:
    paths:
      - "unfold/**"
      - ".github/workflows/unfold-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # 로그에 한글을 찍을 때 cp1252 로 깨져 멈추지 않게
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: unfold
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: unfold/requirements.txt

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller==6.16.0

      - name: 전개 시험
        run: python -m pytest tests -q

      - name: 실행 파일 만들기
        run: pyinstaller packaging/HanilUnfold.spec --noconfirm --distpath dist --workpath build

      - name: 만든 실행 파일로 견본 전개해 보기
        shell: pwsh
        run: |
          $out = Join-Path $PWD "smoke"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath "dist\HanilUnfold\HanilUnfold.exe" `
                 -ArgumentList @("convert", "samples\bracket_t2.step", "samples\tray_t1.6.step",
                                 "samples\freeform_panel_t1.step", "--report", "pdf,xlsx", "-o", $out) `
                 -Wait -PassThru
          Get-ChildItem $out
          $log = Join-Path $out "convert_errors.log"
          if (Test-Path $log) { Get-Content $log -Encoding utf8 }
          if ($p.ExitCode -ne 0) { throw "실행 파일 전개 실패 (종료 코드 $($p.ExitCode))" }
          if ((Get-ChildItem $out -Filter *.dxf).Count -ne 3) { throw "DXF 가 만들어지지 않았습니다" }
          if ((Get-ChildItem $out -Filter *.pdf).Count -ne 3) { throw "PDF 보고서가 만들어지지 않았습니다" }
          if (-not (Test-Path (Join-Path $out "parts_list.xlsx"))) { throw "부품 목록 엑셀이 없습니다" }

      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-String -Path hanil_unfold\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyVersion=$ver" packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 실패" }

      - uses: actions/upload-artifact@v4
        with:
          name: HanilUnfold-Setup
          path: unfold/dist/HanilUnfold-Setup.exe
          if-no-files-found: error
