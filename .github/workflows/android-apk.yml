#  📱 한일 포털 안드로이드 앱(APK) 만들기
#   android/ 가 바뀌어 올라오면 GitHub 서버가 APK 를 만들어
#   ① 실행 결과(Actions)의 「hanil-staff-apk」 ② 「Releases」의 android-v<판> 에 올려 둔다.
#   ⚠ 손으로도 돌릴 수 있다: Actions → 「Android APK」 → Run workflow
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      #  ⚠ 깃허브 컴퓨터에는 안드로이드 SDK 가 이미 들어 있다(따로 깔면 오히려 깨진다)

      - uses: gradle/actions/setup-gradle@v4

      #  🔁 판 번호 — 구울 때마다 올라간다(앱이 새 판을 알아보는 기준)
      - name: 판 번호
        id: v
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          echo "code=$CODE" >> "$GITHUB_ENV"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "ver=1.1.$CODE" >> "$GITHUB_OUTPUT"

      - name: APK 만들기
        working-directory: android
        env:
          HANIL_KS_PASS: ${{ secrets.HANIL_KS_PASS }}
          APP_CODE: ${{ steps.v.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: 이름 붙이기
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/hanil-staff.apk
          NOTES=$(git log -1 --format=%s | sed 's/"/\\"/g')
          printf '{"version":"%s","code":%s,"notes":"%s"}\n' "${{ steps.v.outputs.ver }}" "$code" "$NOTES" > out/hanil-staff.json
          cat out/hanil-staff.json
          ls -l out

      #  📦 저장소의 release/ 에도 넣는다 — 포털 zip 에 실어 「판 올리기」로 한 번에 올리기 위해
      - name: release 폴더에 넣기
        run: |
          cp out/hanil-staff.apk out/hanil-staff.json release/
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add release/hanil-staff.apk release/hanil-staff.json
          git commit -m "한일 포털 앱 APK v${{ steps.v.outputs.ver }} (GitHub 가 구움)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: hanil-staff-apk
          path: out/

      - name: Releases 에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.v.outputs.ver }}
          name: 한일 포털 앱 v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          body: |
            직원용 한일 포털 안드로이드 앱입니다.
            - 폰에서 hanil-staff.apk 를 받아 설치(「출처를 알 수 없는 앱」 허용)
            - 포털에 올릴 때: hanil-staff.apk · hanil-staff.json 을 포털 서버의 public/app/ 에 둡니다
          files: |
            out/hanil-staff.apk
            out/hanil-staff.json
