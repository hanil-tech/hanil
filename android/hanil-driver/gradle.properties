org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
#  ⚠ 바깥 꾸러미(AndroidX 등)를 하나도 안 쓴다 — 안드로이드에 이미 있는 것만으로 만든다.
#    그래서 앱이 작고(1MB 아래), 굽는 데 실패할 구석이 적다.
android.useAndroidX=false
android.nonTransitiveRClass=true
#  🔑 서명 열쇠 — keys/hanil-driver.jks 와 짝이다(아래 README 참고).
HANIL_STORE_FILE=../keys/hanil-driver.jks
HANIL_STORE_PASSWORD=hanil-driver
HANIL_KEY_ALIAS=hanil
HANIL_KEY_PASSWORD=hanil-driver
