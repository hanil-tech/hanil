plugins { id 'com.android.application' }

android {
  namespace 'com.hanil.driver'
  compileSdk 34

  defaultConfig {
    applicationId 'com.hanil.driver'
    //  ⚠ 안드로이드 8(2017년) 이상. 요즘 쓰는 폰은 다 여기 든다.
    minSdk 26
    targetSdk 34
    //  ⚠ 판 번호는 깃허브가 굽을 때마다 하나씩 올린다(같은 번호면 폰이 「덮어쓰기」를 거부한다).
    //  ⚠ **괄호를 붙여 쓰면 안 된다.** `versionCode (…).toInteger()` 로 적었더니 그루비가
    //   「versionCode(문자열) 을 부르고 그 답에 .toInteger() 를 부른다」로 읽어 **Value is null** 로 죽었다.
    //   `=` 로 또박또박 적는다.
    versionCode = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
    versionName = '1.0.' + (System.getenv('BUILD_NUMBER') ?: '0')
  }

  //  🔑 서명 — **늘 같은 열쇠**로 서명해야 새 판을 덮어쓸 수 있다(열쇠가 바뀌면 지우고 다시 깔아야 한다).
  signingConfigs {
    release {
      storeFile file(HANIL_STORE_FILE)
      storePassword HANIL_STORE_PASSWORD
      keyAlias HANIL_KEY_ALIAS
      keyPassword HANIL_KEY_PASSWORD
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false          // ⚠ 줄일 것도 없다(꾸러미가 없다). 줄이다 깨지는 쪽이 더 나쁘다.
      shrinkResources false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  //  ⚠ 밖에 낼 파일 이름을 사람이 읽을 수 있게 — 「app-release.apk」 로는 무엇인지 모른다.
  applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
      outputFileName = "hanil-driver-${variant.versionName}.apk"
    }
  }
}
