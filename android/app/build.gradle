plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanilsteel.portal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanilsteel.portal'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    //  🔑 사내 배포용 서명 — 이 열쇠(keystore)를 잃어버리면 같은 앱으로 업데이트를 못 한다(꼭 보관)
    signingConfigs {
        release {
            storeFile file('../keystore/hanil-portal.jks')
            storePassword System.getenv('HANIL_KS_PASS') ?: 'hanil-portal'
            keyAlias 'hanil-portal'
            keyPassword System.getenv('HANIL_KS_PASS') ?: 'hanil-portal'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
