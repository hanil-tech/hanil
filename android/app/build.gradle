plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanilsteel.portal'
    compileSdk 35

    defaultConfig {
        //  ⭐ 포털의 「앱 받기(/app)」가 직원용 앱 자리로 정해 둔 이름 — 판 확인(/api/app/version?app=staff)과 짝
        applicationId 'com.hanil.portal.staff'
        minSdk 24
        targetSdk 35
        //  🔁 GitHub 가 구울 때마다 번호를 하나씩 올린다(APP_CODE) — 폰의 앱이 「더 새 판」으로 알아본다
        versionCode((System.getenv('APP_CODE') ?: '2') as int)
        versionName '1.1.' + (System.getenv('APP_CODE') ?: '2')
    }

    //  🔑 사내 배포용 서명 — 이 열쇠(keystore)를 잃어버리면 같은 앱으로 업데이트를 못 한다(꼭 보관)
    signingConfigs {
        release {
            storeFile file('../keystore/hanil-portal.jks')
            storePassword System.getenv('HANIL_KS_PASS') ?: 'hanil-portal'
            keyAlias 'hanil-portal'
            keyPassword System.getenv('HANIL_KS_PASS') ?: 'hanil-portal'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    //  ⚠ 라이브러리들이 서로 다른 판의 kotlin-stdlib(-jdk7/-jdk8)를 끌고 와서 같은 클래스가 겹친다 — 판을 하나로 맞춘다
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
